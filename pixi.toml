[workspace]
name = "earthpv"
authors = ["ly0n <tobiasaugspurger@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"

# Default env: data pipeline (labels, imagery, chips, postprocess, export).
# The heavy ML stack (torch cu126 + terratorch) lives in the `ml` feature so
# data work doesn't wait on a multi-GB solve.
[pypi-dependencies]
earthpv = { path = ".", editable = true }
duckdb = ">=1.1"
geopandas = ">=1.0"
pyarrow = ">=15"
shapely = ">=2.0"
rasterio = ">=1.3"
rioxarray = "*"
xarray = "*"
odc-stac = "*"
pystac-client = "*"
planetary-computer = "*"
typer = "*"
pyyaml = "*"
matplotlib = "*"
tqdm = "*"
pyogrio = "*"
open-mastr = "*"
sqlalchemy = "*"
requests = "*"
pvlib = "*"
skyfield = ">=1.45"
scikit-learn = ">=1.5"

[feature.ml.pypi-dependencies]
# GTX 1060 (Pascal, sm_61): CUDA 13 dropped Pascal, so pin cu126 wheels.
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.22.1", index = "https://download.pytorch.org/whl/cu126" }
terratorch = ">=1.0"

# Documentation site (MkDocs Material). Kept out of the default solve so a docs
# edit never waits on the data-pipeline or torch environments.
[feature.docs.dependencies]
python = "3.11.*"

[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"

[environments]
default = { solve-group = "default" }
ml = { features = ["ml"], solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true }

[tasks]
labels = "python -m earthpv.cli labels"
chips = "python -m earthpv.cli chips"
postprocess = "python -m earthpv.cli postprocess"
export = "python -m earthpv.cli export"
mastr = "python -m earthpv.cli mastr"
calibrate = "python -m earthpv.cli calibrate"
# Main workflow, primary output (docs/reproduce.md steps 9-15) -- no pixi task existed
# for any of these before 2026-08-10, despite everything upstream having one.
calibrate-candidates = "python -m earthpv.cli calibrate-candidates"
density = "python -m earthpv.cli density"
check-density = "python -m earthpv.cli check-density"
roof-classifier = "python -m earthpv.cli roof-classifier"
roofclf-score-national = "python -m earthpv.cli roofclf-score-national"
sub400-capacity = "python -m earthpv.cli sub400-capacity"
ge400-roof-capacity = "python -m earthpv.cli ge400-roof-capacity"
atlas = "python -m earthpv.cli atlas"
# Small-PV (< 400 m2) JOSM validation leads, AND-gate + roofclf-only populations --
# re-run whenever roofclf/SPPI national scoring or the OSM solar pull is refreshed.
small-pv-leads = "python scripts/build_small_pv_josm_leads.py"
# Rooftop-potential (large, currently-uncovered roof) JOSM/site-visit leads -- re-run
# whenever `earthpv large-roof-buildings` or the national OSM solar pull is refreshed.
potential-leads = "python scripts/build_potential_leads.py"
# Every calibration quadrat as one JOSM layer (boxes + already-mapped solar) for a
# completeness pass against OSM imagery -- re-run whenever a quadrat is added or an
# `_overpass_solar` pull is refreshed. See docs/calibration-mapping-protocol.md.
calib-export = "python scripts/export_calibration_quadrats_geojson.py"
# Every detected rooftop-PV candidate nationally as one JOSM validation layer -- re-run
# whenever `earthpv postprocess` (candidates.parquet) is refreshed.
rooftop-detections-export = "python scripts/export_rooftop_detections_geojson.py"
# roofclf-flagged buildings (sub-400 m2, density-domain-restricted, capped per cell) as
# one JOSM validation layer -- re-run whenever roofclf national scoring is refreshed.
roofclf-detections-export = "python scripts/export_roofclf_detections_geojson.py"
# EVERY roofclf-flagged building in one/many cells, a bbox, all calibration quadrats, or
# N random national cells (--random-cells, the essential un-curated validation batch --
# see docs/methods/roofclf-national-validation.md), complete and never sampled, split
# into as many tiled JOSM files per region as it takes to keep each one reviewable -- no
# domain restriction, unlike roofclf-detections-export.
roofclf-tiles = "python scripts/tile_roofclf_detections_geojson.py"
# Per-quadrat PV density vs detection quality (discrimination and bias kept apart, with
# partial correlations controlling for installation size) -- re-run when a quadrat is
# added or `earthpv roof-classifier` is re-run. See docs/methods/density.md.
quadrat-correlations = "python scripts/quadrat_correlations.py"
# Regenerate every figure and interactive page the docs site and README embed.
docs-figures = "python scripts/build_docs_figures.py"
# Re-capture the interactive HTML pages as PNGs for the README (needs firefox).
docs-screenshots = "python scripts/screenshot_pages.py"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

[feature.ml.tasks]
train = "python -m earthpv.cli train"
infer = "python -m earthpv.cli infer"
gpu-check = "python -c 'import torch; print(torch.__version__, torch.cuda.is_available(), torch.cuda.get_device_name(0))'"
