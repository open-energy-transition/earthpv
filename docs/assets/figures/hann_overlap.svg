  <g id="text_12">
   <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2a2216" x="69.992227" y="22.458047" transform="rotate(-0 69.992227 22.458047)">Why inference windows are tapered before they overlap</text>
  </g>
  <g id="text_13">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5f5540" x="69.992227" y="38.190047" transform="rotate(-0 69.992227 38.190047)">Each window's prediction fades to zero at its own edges, so neighbouring windows blend instead of</text>
  </g>
  <g id="text_14">
