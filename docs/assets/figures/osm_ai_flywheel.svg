<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480"
     viewBox="0 0 900 480" font-family="DejaVu Sans, system-ui, sans-serif">
  <defs>
    <marker id="alight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c25e12"/>
    </marker>
    <marker id="blight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c6fa8"/>
    </marker>
  </defs>
  <rect width="900" height="480" rx="10" fill="#f1ebdd"/>
  <text x="50" y="42" font-size="17" font-weight="600" fill="#2a2216">The mapping flywheel</text>
  <text x="50" y="64" font-size="12" fill="#5f5540">Every turn leaves the training data larger, cleaner and more local.</text>

  <g stroke="#c25e12" stroke-width="2" fill="none" marker-end="url(#alight)">
    <path d="M432,148 H466"/>
    <path d="M660,196 V266"/>
  </g>
  <g stroke="#1c6fa8" stroke-width="2" fill="none" marker-end="url(#blight)">
    <path d="M468,330 H434"/>
    <path d="M240,266 V200"/>
  </g>

  <rect x="50" y="102" width="382" height="94" rx="8" fill="#faf6ec" stroke="#cfc0a5"/>
  <text x="72" y="132" font-size="13" font-weight="600" fill="#2a2216">1. OpenStreetMap labels</text>
  <text x="72" y="154" font-size="11" fill="#5f5540">Solar polygons drawn by mappers, pulled live</text>
  <text x="72" y="172" font-size="11" fill="#5f5540">through Overpass or Overture Maps.</text>

  <rect x="468" y="102" width="382" height="94" rx="8" fill="#faf6ec" stroke="#cfc0a5"/>
  <text x="490" y="132" font-size="13" font-weight="600" fill="#2a2216">2. Fine-tune TerraMind on Sentinel-2</text>
  <text x="490" y="154" font-size="11" fill="#5f5540">Free 10 m imagery, worldwide, every five days.</text>
  <text x="490" y="172" font-size="11" fill="#5f5540">No commercial tile licence in the way.</text>

  <rect x="468" y="266" width="382" height="128" rx="8" fill="#faf6ec" stroke="#cfc0a5"/>
  <text x="490" y="296" font-size="13" font-weight="600" fill="#2a2216">3. Rank candidates, publish leads</text>
  <text x="490" y="318" font-size="11" fill="#5f5540">Recall-first. A building prior, glint corroboration,</text>
  <text x="490" y="336" font-size="11" fill="#5f5540">a pre-boom epoch check and a vegetation veto</text>
  <text x="490" y="354" font-size="11" fill="#5f5540">reorder the queue; a MapRoulette challenge</text>
  <text x="490" y="372" font-size="11" fill="#5f5540">carries it to mappers.</text>

  <rect x="50" y="266" width="382" height="128" rx="8" fill="#faf6ec" stroke="#cfc0a5"/>
  <text x="72" y="296" font-size="13" font-weight="600" fill="#2a2216">4. People verify what the model found</text>
  <text x="72" y="318" font-size="11" fill="#5f5540">Local mappers open each lead in the OpenStreetMap</text>
  <text x="72" y="336" font-size="11" fill="#5f5540">editor, check it against Esri, Bing and Mapbox</text>
  <text x="72" y="354" font-size="11" fill="#5f5540">imagery, then map it properly with local context.</text>
  <text x="72" y="376" font-size="11" fill="#1c6fa8">Verified installations become the next training labels.</text>

  <text x="676" y="236" font-size="11" fill="#c25e12">detections out</text>
  <text x="256" y="236" font-size="11" fill="#1c6fa8">verified labels back in</text>
  <text x="50" y="440" font-size="11" fill="#5f5540">Only free and openly licensed imagery reaches the model. The high-resolution</text>
  <text x="50" y="458" font-size="11" fill="#5f5540">layers are used by people, inside the editor, where their licences allow it.</text>
</svg>
