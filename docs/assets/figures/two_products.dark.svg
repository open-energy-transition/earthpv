<svg xmlns="http://www.w3.org/2000/svg" width="900" height="214"
     viewBox="0 0 900 214" font-family="DejaVu Sans, system-ui, sans-serif">
  <rect width="900" height="214" rx="10" fill="#1a1a19"/>
  <text x="30" y="34" font-size="14" font-weight="600" fill="#ffffff">Two products from one model</text>

  <rect x="30" y="56" width="180" height="60" rx="7" fill="#232321" stroke="#383835"/>
  <text x="48" y="82" font-size="12" font-weight="600" fill="#ffffff">Sentinel-2 L2A</text>
  <text x="48" y="100" font-size="10.5" fill="#c3c2b7">dry-season composites</text>

  <rect x="238" y="56" width="180" height="60" rx="7" fill="#232321" stroke="#383835"/>
  <text x="256" y="82" font-size="12" font-weight="600" fill="#ffffff">TerraMind-tiny</text>
  <text x="256" y="100" font-size="10.5" fill="#c3c2b7">probability raster</text>

  <rect x="446" y="26" width="204" height="60" rx="7" fill="#232321" stroke="#3987e5"/>
  <text x="464" y="52" font-size="12" font-weight="600" fill="#3987e5">Leads product</text>
  <text x="464" y="70" font-size="10.5" fill="#c3c2b7">polygons for human review</text>

  <rect x="446" y="116" width="204" height="60" rx="7" fill="#232321" stroke="#199e70"/>
  <text x="464" y="142" font-size="12" font-weight="600" fill="#199e70">Capacity product</text>
  <text x="464" y="160" font-size="10.5" fill="#c3c2b7">MWp per building and cell</text>

  <rect x="678" y="26" width="192" height="60" rx="7" fill="#232321" stroke="#383835"/>
  <text x="696" y="52" font-size="12" font-weight="600" fill="#ffffff">OpenStreetMap</text>
  <text x="696" y="70" font-size="10.5" fill="#c3c2b7">MapRoulette challenge</text>

  <rect x="678" y="116" width="192" height="60" rx="7" fill="#232321" stroke="#383835"/>
  <text x="696" y="142" font-size="12" font-weight="600" fill="#ffffff">PyPSA-Earth</text>
  <text x="696" y="160" font-size="10.5" fill="#c3c2b7">0.1 degree grid CSV</text>

  <g stroke="#c3c2b7" stroke-width="1.6" fill="none">
    <path d="M210,86 H236"/>
    <path d="M418,86 H432 V56 H444"/>
    <path d="M418,86 H432 V146 H444"/>
  </g>
  <g stroke="#3987e5" stroke-width="1.6" fill="none"><path d="M650,56 H676"/></g>
  <g stroke="#199e70" stroke-width="1.6" fill="none"><path d="M650,146 H676"/></g>

  <text x="30" y="200" font-size="10.5" fill="#c3c2b7">False positives are useful on the top path and forbidden on the bottom one, so only the bottom path is precision-calibrated.</text>
</svg>
