<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="988" viewBox="0 0 1200 988" font-family="DejaVu Sans, system-ui, sans-serif"><defs><marker id="ah-5f5540-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5540"/></marker><marker id="ah-c25e12-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25e12"/></marker><marker id="ah-1c6fa8-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c6fa8"/></marker><marker id="ah-1f9b8a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9b8a"/></marker></defs><rect width="1200" height="988" rx="10" fill="#f1ebdd"/><text x="40" y="38" font-size="17.5" font-weight="600" fill="#2a2216">How raw data becomes a mapping lead and a capacity number</text><text x="40" y="60" font-size="12" fill="#5f5540">Five instruments read the same Sentinel-2 composites and combine into two products: OpenStreetMap mapping leads and a calibrated capacity atlas.</text><text x="40" y="84" font-size="11.3" font-weight="600" fill="#5f5540">Raw data</text><rect x="40" y="90" width="340" height="84" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="56" y="113" font-size="12.2" font-weight="600" fill="#2a2216">Sentinel-2 L2A</text><text x="56" y="130" font-size="10.1" fill="#5f5540">10-band dry-season composites,</text><text x="56" y="147" font-size="10.1" fill="#5f5540">reused per tile or built on demand</text><text x="56" y="164" font-size="10.1" fill="#5f5540">by compose</text><rect x="430" y="90" width="340" height="84" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="446" y="113" font-size="12.2" font-weight="600" fill="#2a2216">OSM / Overture solar labels</text><text x="446" y="130" font-size="10.1" fill="#5f5540">mapped installations, plus live</text><text x="446" y="147" font-size="10.1" fill="#5f5540">Overpass pulls for new areas</text><rect x="820" y="90" width="340" height="84" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="836" y="113" font-size="12.2" font-weight="600" fill="#2a2216">VIDA / Overture buildings</text><text x="836" y="130" font-size="10.1" fill="#5f5540">imagery-derived footprints,</text><text x="836" y="147" font-size="10.1" fill="#5f5540">includes small unmapped roofs</text><text x="40" y="228" font-size="11.3" font-weight="600" fill="#5f5540">Train</text><rect x="40" y="234" width="520" height="84" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="56" y="257" font-size="12.2" font-weight="600" fill="#2a2216">chips</text><text x="56" y="274" font-size="10.1" fill="#5f5540">jittered positive windows,</text><text x="56" y="291" font-size="10.1" fill="#5f5540">labels burned to per-pixel masks</text><rect x="640" y="234" width="520" height="84" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="656" y="257" font-size="12.2" font-weight="600" fill="#2a2216">TerraMind-tiny fine-tune</text><text x="656" y="274" font-size="10.1" fill="#5f5540">TerraTorch + Lightning,</text><text x="656" y="291" font-size="10.1" fill="#5f5540">checkpoint monitors val mIoU</text><text x="40" y="372" font-size="11.3" font-weight="600" fill="#5f5540">Inference — five instruments, same Sentinel-2 imagery</text><rect x="40" y="378" width="208" height="106" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="56" y="401" font-size="12.2" font-weight="600" fill="#2a2216">Segmentation raster</text><text x="56" y="418" font-size="10.1" fill="#5f5540">infer: per-pixel PV</text><text x="56" y="435" font-size="10.1" fill="#5f5540">probability, primary</text><text x="56" y="452" font-size="10.1" fill="#5f5540">≥ 400 m² instrument</text><rect x="268" y="378" width="208" height="106" rx="8" fill="#faf6ec" stroke="#1f9b8a" stroke-width="1.8"/><text x="284" y="401" font-size="12.2" font-weight="600" fill="#2a2216">Fraction head</text><text x="284" y="418" font-size="10.1" fill="#5f5540">alt checkpoint: per-pixel</text><text x="284" y="435" font-size="10.1" fill="#5f5540">PV coverage fraction,</text><text x="284" y="452" font-size="10.1" fill="#5f5540">drops the polygon</text><rect x="496" y="378" width="208" height="106" rx="8" fill="#faf6ec" stroke="#1c6fa8" stroke-width="1.8"/><text x="512" y="401" font-size="12.2" font-weight="600" fill="#2a2216">Glint matched filter</text><text x="512" y="418" font-size="10.1" fill="#5f5540">specular flash geometry,</text><text x="512" y="435" font-size="10.1" fill="#5f5540">corroborates only</text><text x="512" y="452" font-size="10.1" fill="#5f5540">(never demotes)</text><rect x="724" y="378" width="208" height="106" rx="8" fill="#faf6ec" stroke="#1f9b8a" stroke-width="1.8"/><text x="740" y="401" font-size="12.2" font-weight="600" fill="#2a2216">SPPI</text><text x="740" y="418" font-size="10.1" fill="#5f5540">zero-training spectral</text><text x="740" y="435" font-size="10.1" fill="#5f5540">index, cross-validated,</text><text x="740" y="452" font-size="10.1" fill="#5f5540">no model fit</text><rect x="952" y="378" width="208" height="106" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="968" y="401" font-size="12.2" font-weight="600" fill="#2a2216">roofclf</text><text x="968" y="418" font-size="10.1" fill="#5f5540">per-building classifier:</text><text x="968" y="435" font-size="10.1" fill="#5f5540">size + reflectance,</text><text x="968" y="452" font-size="10.1" fill="#5f5540">calibration quadrats</text><text x="40" y="502" font-size="9.6" font-style="italic" fill="#5f5540">Glint and SPPI read the composites directly, no model fit; segmentation and the fraction head share one TerraMind checkpoint; roofclf trains separately on calibration-quadrat labels.</text><text x="40" y="538" font-size="11.3" font-weight="600" fill="#5f5540">Combine &amp; rank</text><rect x="40" y="544" width="340" height="100" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="56" y="567" font-size="12.2" font-weight="600" fill="#2a2216">postprocess</text><text x="56" y="584" font-size="10.1" fill="#5f5540">polygonize, join to building</text><text x="56" y="601" font-size="10.1" fill="#5f5540">footprint, rank_score for</text><text x="56" y="618" font-size="10.1" fill="#5f5540">the leads queue</text><rect x="430" y="544" width="340" height="100" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="446" y="567" font-size="12.2" font-weight="600" fill="#2a2216">density</text><text x="446" y="584" font-size="10.1" fill="#5f5540">per-building / cell / region</text><text x="446" y="601" font-size="10.1" fill="#5f5540">MWp: _det / _exp / _cal,</text><text x="446" y="618" font-size="10.1" fill="#5f5540">≥ 400 m² only</text><rect x="820" y="544" width="340" height="100" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="836" y="567" font-size="12.2" font-weight="600" fill="#2a2216">sub-400 m² bracket</text><text x="836" y="584" font-size="10.1" fill="#5f5540">domain-restricted roofclf +</text><text x="836" y="601" font-size="10.1" fill="#5f5540">SPPI AND-gate, building-</text><text x="836" y="618" font-size="10.1" fill="#5f5540">density-matched cells</text><text x="40" y="664" font-size="11.3" font-weight="600" fill="#5f5540">Plausibility gate</text><rect x="370" y="670" width="460" height="62" rx="8" fill="#faf6ec" stroke="#1c6fa8" stroke-width="1.8"/><text x="386" y="693" font-size="12.2" font-weight="600" fill="#2a2216">check-density</text><text x="386" y="710" font-size="10.1" fill="#5f5540">ground:rooftop capacity ratio + single-cell concentration checks</text><text x="40" y="780" font-size="11.3" font-weight="600" fill="#5f5540">Outputs</text><rect x="40" y="786" width="265" height="94" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="56" y="809" font-size="12.2" font-weight="600" fill="#2a2216">MapRoulette leads</text><text x="56" y="826" font-size="10.1" fill="#5f5540">→ OpenStreetMap,</text><text x="56" y="843" font-size="10.1" fill="#5f5540">a human verifies every</text><text x="56" y="860" font-size="10.1" fill="#5f5540">candidate</text><rect x="325" y="786" width="265" height="94" rx="8" fill="#faf6ec" stroke="#1f9b8a" stroke-width="1.8"/><text x="341" y="809" font-size="12.2" font-weight="600" fill="#2a2216">Capacity atlas / dashboard</text><text x="341" y="826" font-size="10.1" fill="#5f5540">MWp per building, cell</text><text x="341" y="843" font-size="10.1" fill="#5f5540">and region, ≥ 400 m²</text><rect x="610" y="786" width="265" height="94" rx="8" fill="#faf6ec" stroke="#1f9b8a" stroke-width="1.8"/><text x="626" y="809" font-size="12.2" font-weight="600" fill="#2a2216">PyPSA-Earth grid CSV</text><text x="626" y="826" font-size="10.1" fill="#5f5540">0.1° cell capacity for</text><text x="626" y="843" font-size="10.1" fill="#5f5540">power-system modelling</text><rect x="895" y="786" width="265" height="94" rx="8" fill="#faf6ec" stroke="#1c6fa8" stroke-width="1.8"/><text x="911" y="809" font-size="12.2" font-weight="600" fill="#2a2216">Evidence atlas</text><text x="911" y="826" font-size="10.1" fill="#5f5540">Best estimate, sub-400 m²</text><text x="911" y="843" font-size="10.1" fill="#5f5540">plus ≥ 400 m²</text><text x="40" y="936" font-size="9.6" font-style="italic" fill="#5f5540">Building footprints also feed roofclf and the sub-400 m² bracket directly (arrows omitted for clarity).</text><text x="40" y="954" font-size="9.6" font-style="italic" fill="#5f5540">Solid grey = the main trunk. Blue = load-bearing instruments. Orange = glint, corroborates only. Aqua = auxiliary instruments not (yet) in the headline number.</text><path d="M210,174 V204 H300 V234" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M600,174 V204 H300 V234" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M560,276 H640" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M900,318 V348 H144 V378" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M144,484 V514 H210 V544" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><path d="M144,484 V514 H600 V544" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><path d="M372,484 V514 H600 V544" stroke="#1f9b8a" stroke-width="1.7" fill="none" marker-end="url(#ah-1f9b8a-light)" stroke-dasharray="6,4"/><path d="M600,484 V514 H210 V544" stroke="#1c6fa8" stroke-width="1.7" fill="none" marker-end="url(#ah-1c6fa8-light)"/><path d="M828,484 V514 H990 V544" stroke="#1f9b8a" stroke-width="1.7" fill="none" marker-end="url(#ah-1f9b8a-light)"/><path d="M1056,484 V514 H990 V544" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><path d="M210,644 V715 H172 V786" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M600,644 V657 H600 V670" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M600,732 V759 H458 V786" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M590,833 H610" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M458,880 V902 H1028 V880" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><text x="742" y="915" font-size="9.2" fill="#5f5540" text-anchor="middle">+ existing ≥ 400 m² total</text><path d="M990,644 V715 H1028 V786" stroke="#1c6fa8" stroke-width="1.7" fill="none" marker-end="url(#ah-1c6fa8-light)"/><path d="M40,833 H18 V204 H600 V174" stroke="#1c6fa8" stroke-width="1.7" fill="none" marker-end="url(#ah-1c6fa8-light)" stroke-dasharray="6,4"/><text x="309" y="197" font-size="9.2" fill="#1c6fa8" text-anchor="middle">verified leads become new training labels</text></svg>