<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="988" viewBox="0 0 1200 988" font-family="DejaVu Sans, system-ui, sans-serif"><defs><marker id="ah-52514e-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-2a78d6-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-eb6834-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="ah-1baf7a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker></defs><rect width="1200" height="988" rx="10" fill="#fcfcfb"/><text x="40" y="38" font-size="17.5" font-weight="600" fill="#0b0b0b">How raw data becomes a mapping lead and a capacity number</text><text x="40" y="60" font-size="12" fill="#52514e">Five instruments read the same Sentinel-2 composites and combine into two products: OpenStreetMap mapping leads and a calibrated capacity atlas.</text><text x="40" y="84" font-size="11.3" font-weight="600" fill="#52514e">Raw data</text><rect x="40" y="90" width="340" height="84" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.1"/><text x="56" y="113" font-size="12.2" font-weight="600" fill="#0b0b0b">Sentinel-2 L2A</text><text x="56" y="130" font-size="10.1" fill="#52514e">10-band dry-season composites,</text><text x="56" y="147" font-size="10.1" fill="#52514e">reused per tile or built on demand</text><text x="56" y="164" font-size="10.1" fill="#52514e">by compose</text><rect x="430" y="90" width="340" height="84" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.1"/><text x="446" y="113" font-size="12.2" font-weight="600" fill="#0b0b0b">OSM / Overture solar labels</text><text x="446" y="130" font-size="10.1" fill="#52514e">mapped installations, plus live</text><text x="446" y="147" font-size="10.1" fill="#52514e">Overpass pulls for new areas</text><rect x="820" y="90" width="340" height="84" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.1"/><text x="836" y="113" font-size="12.2" font-weight="600" fill="#0b0b0b">VIDA / Overture buildings</text><text x="836" y="130" font-size="10.1" fill="#52514e">imagery-derived footprints,</text><text x="836" y="147" font-size="10.1" fill="#52514e">includes small unmapped roofs</text><text x="40" y="228" font-size="11.3" font-weight="600" fill="#52514e">Train</text><rect x="40" y="234" width="520" height="84" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.1"/><text x="56" y="257" font-size="12.2" font-weight="600" fill="#0b0b0b">chips</text><text x="56" y="274" font-size="10.1" fill="#52514e">jittered positive windows,</text><text x="56" y="291" font-size="10.1" fill="#52514e">labels burned to per-pixel masks</text><rect x="640" y="234" width="520" height="84" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.1"/><text x="656" y="257" font-size="12.2" font-weight="600" fill="#0b0b0b">TerraMind-tiny fine-tune</text><text x="656" y="274" font-size="10.1" fill="#52514e">TerraTorch + Lightning,</text><text x="656" y="291" font-size="10.1" fill="#52514e">checkpoint monitors val mIoU</text><text x="40" y="372" font-size="11.3" font-weight="600" fill="#52514e">Inference — five instruments, same Sentinel-2 imagery</text><rect x="40" y="378" width="208" height="106" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="56" y="401" font-size="12.2" font-weight="600" fill="#0b0b0b">Segmentation raster</text><text x="56" y="418" font-size="10.1" fill="#52514e">infer: per-pixel PV</text><text x="56" y="435" font-size="10.1" fill="#52514e">probability, primary</text><text x="56" y="452" font-size="10.1" fill="#52514e">≥ 400 m² instrument</text><rect x="268" y="378" width="208" height="106" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/><text x="284" y="401" font-size="12.2" font-weight="600" fill="#0b0b0b">Fraction head</text><text x="284" y="418" font-size="10.1" fill="#52514e">alt checkpoint: per-pixel</text><text x="284" y="435" font-size="10.1" fill="#52514e">PV coverage fraction,</text><text x="284" y="452" font-size="10.1" fill="#52514e">drops the polygon</text><rect x="496" y="378" width="208" height="106" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="512" y="401" font-size="12.2" font-weight="600" fill="#0b0b0b">Glint matched filter</text><text x="512" y="418" font-size="10.1" fill="#52514e">specular flash geometry,</text><text x="512" y="435" font-size="10.1" fill="#52514e">corroborates only</text><text x="512" y="452" font-size="10.1" fill="#52514e">(never demotes)</text><rect x="724" y="378" width="208" height="106" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/><text x="740" y="401" font-size="12.2" font-weight="600" fill="#0b0b0b">SPPI</text><text x="740" y="418" font-size="10.1" fill="#52514e">zero-training spectral</text><text x="740" y="435" font-size="10.1" fill="#52514e">index, cross-validated,</text><text x="740" y="452" font-size="10.1" fill="#52514e">no model fit</text><rect x="952" y="378" width="208" height="106" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="968" y="401" font-size="12.2" font-weight="600" fill="#0b0b0b">roofclf</text><text x="968" y="418" font-size="10.1" fill="#52514e">per-building classifier:</text><text x="968" y="435" font-size="10.1" fill="#52514e">size + reflectance,</text><text x="968" y="452" font-size="10.1" fill="#52514e">calibration quadrats</text><text x="40" y="502" font-size="9.6" font-style="italic" fill="#52514e">Glint and SPPI read the composites directly, no model fit; segmentation and the fraction head share one TerraMind checkpoint; roofclf trains separately on calibration-quadrat labels.</text><text x="40" y="538" font-size="11.3" font-weight="600" fill="#52514e">Combine &amp; rank</text><rect x="40" y="544" width="340" height="100" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.1"/><text x="56" y="567" font-size="12.2" font-weight="600" fill="#0b0b0b">postprocess</text><text x="56" y="584" font-size="10.1" fill="#52514e">polygonize, join to building</text><text x="56" y="601" font-size="10.1" fill="#52514e">footprint, rank_score for</text><text x="56" y="618" font-size="10.1" fill="#52514e">the leads queue</text><rect x="430" y="544" width="340" height="100" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.1"/><text x="446" y="567" font-size="12.2" font-weight="600" fill="#0b0b0b">density</text><text x="446" y="584" font-size="10.1" fill="#52514e">per-building / cell / region</text><text x="446" y="601" font-size="10.1" fill="#52514e">MWp: _det / _exp / _cal,</text><text x="446" y="618" font-size="10.1" fill="#52514e">≥ 400 m² only</text><rect x="820" y="544" width="340" height="100" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.1"/><text x="836" y="567" font-size="12.2" font-weight="600" fill="#0b0b0b">sub-400 m² bracket</text><text x="836" y="584" font-size="10.1" fill="#52514e">domain-restricted roofclf +</text><text x="836" y="601" font-size="10.1" fill="#52514e">SPPI AND-gate, building-</text><text x="836" y="618" font-size="10.1" fill="#52514e">density-matched cells</text><text x="40" y="664" font-size="11.3" font-weight="600" fill="#52514e">Plausibility gate</text><rect x="370" y="670" width="460" height="62" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="386" y="693" font-size="12.2" font-weight="600" fill="#0b0b0b">check-density</text><text x="386" y="710" font-size="10.1" fill="#52514e">ground:rooftop capacity ratio + single-cell concentration checks</text><text x="40" y="780" font-size="11.3" font-weight="600" fill="#52514e">Outputs</text><rect x="40" y="786" width="265" height="94" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="56" y="809" font-size="12.2" font-weight="600" fill="#0b0b0b">MapRoulette leads</text><text x="56" y="826" font-size="10.1" fill="#52514e">→ OpenStreetMap,</text><text x="56" y="843" font-size="10.1" fill="#52514e">a human verifies every</text><text x="56" y="860" font-size="10.1" fill="#52514e">candidate</text><rect x="325" y="786" width="265" height="94" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/><text x="341" y="809" font-size="12.2" font-weight="600" fill="#0b0b0b">Capacity atlas / dashboard</text><text x="341" y="826" font-size="10.1" fill="#52514e">MWp per building, cell</text><text x="341" y="843" font-size="10.1" fill="#52514e">and region, ≥ 400 m²</text><rect x="610" y="786" width="265" height="94" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/><text x="626" y="809" font-size="12.2" font-weight="600" fill="#0b0b0b">PyPSA-Earth grid CSV</text><text x="626" y="826" font-size="10.1" fill="#52514e">0.1° cell capacity for</text><text x="626" y="843" font-size="10.1" fill="#52514e">power-system modelling</text><rect x="895" y="786" width="265" height="94" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="911" y="809" font-size="12.2" font-weight="600" fill="#0b0b0b">Evidence atlas</text><text x="911" y="826" font-size="10.1" fill="#52514e">Verified / Best estimate /</text><text x="911" y="843" font-size="10.1" fill="#52514e">Ceiling tiers, sub-400 m²</text><text x="911" y="860" font-size="10.1" fill="#52514e">plus ≥ 400 m²</text><text x="40" y="936" font-size="9.6" font-style="italic" fill="#52514e">Building footprints also feed roofclf and the sub-400 m² bracket directly (arrows omitted for clarity).</text><text x="40" y="954" font-size="9.6" font-style="italic" fill="#52514e">Solid grey = the main trunk. Blue = load-bearing instruments. Orange = glint, corroborates only. Aqua = auxiliary instruments not (yet) in the headline number.</text><path d="M210,174 V204 H300 V234" stroke="#52514e" stroke-width="1.7" fill="none" marker-end="url(#ah-52514e-light)"/><path d="M600,174 V204 H300 V234" stroke="#52514e" stroke-width="1.7" fill="none" marker-end="url(#ah-52514e-light)"/><path d="M560,276 H640" stroke="#52514e" stroke-width="1.7" fill="none" marker-end="url(#ah-52514e-light)"/><path d="M900,318 V348 H144 V378" stroke="#52514e" stroke-width="1.7" fill="none" marker-end="url(#ah-52514e-light)"/><path d="M144,484 V514 H210 V544" stroke="#2a78d6" stroke-width="1.7" fill="none" marker-end="url(#ah-2a78d6-light)"/><path d="M144,484 V514 H600 V544" stroke="#2a78d6" stroke-width="1.7" fill="none" marker-end="url(#ah-2a78d6-light)"/><path d="M372,484 V514 H600 V544" stroke="#1baf7a" stroke-width="1.7" fill="none" marker-end="url(#ah-1baf7a-light)" stroke-dasharray="6,4"/><path d="M600,484 V514 H210 V544" stroke="#eb6834" stroke-width="1.7" fill="none" marker-end="url(#ah-eb6834-light)"/><path d="M828,484 V514 H990 V544" stroke="#1baf7a" stroke-width="1.7" fill="none" marker-end="url(#ah-1baf7a-light)"/><path d="M1056,484 V514 H990 V544" stroke="#2a78d6" stroke-width="1.7" fill="none" marker-end="url(#ah-2a78d6-light)"/><path d="M210,644 V715 H172 V786" stroke="#52514e" stroke-width="1.7" fill="none" marker-end="url(#ah-52514e-light)"/><path d="M600,644 V657 H600 V670" stroke="#52514e" stroke-width="1.7" fill="none" marker-end="url(#ah-52514e-light)"/><path d="M600,732 V759 H458 V786" stroke="#52514e" stroke-width="1.7" fill="none" marker-end="url(#ah-52514e-light)"/><path d="M590,833 H610" stroke="#52514e" stroke-width="1.7" fill="none" marker-end="url(#ah-52514e-light)"/><path d="M458,880 V902 H1028 V880" stroke="#52514e" stroke-width="1.7" fill="none" marker-end="url(#ah-52514e-light)"/><text x="742" y="915" font-size="9.2" fill="#52514e" text-anchor="middle">+ existing ≥ 400 m² total</text><path d="M990,644 V715 H1028 V786" stroke="#eb6834" stroke-width="1.7" fill="none" marker-end="url(#ah-eb6834-light)"/><path d="M40,833 H18 V204 H600 V174" stroke="#eb6834" stroke-width="1.7" fill="none" marker-end="url(#ah-eb6834-light)" stroke-dasharray="6,4"/><text x="309" y="197" font-size="9.2" fill="#eb6834" text-anchor="middle">verified leads become new training labels</text></svg>