<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="890" viewBox="0 0 1150 890" font-family="DejaVu Sans, system-ui, sans-serif"><defs><marker id="ah-5f5540-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5540"/></marker><marker id="ah-c25e12-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25e12"/></marker><marker id="ah-1c6fa8-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c6fa8"/></marker><marker id="ah-1f9b8a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9b8a"/></marker></defs><rect width="1150" height="890" rx="10" fill="#f1ebdd"/><text x="40" y="38" font-size="17.5" font-weight="600" fill="#2a2216">How the evidence atlas is built</text><text x="40" y="60" font-size="12" fill="#5f5540">Two detectors, split by placement and calibration coverage rather than by size alone, measured against hand-mapped ground truth and combined into one defensible figure.</text><text x="40" y="84" font-size="11.3" font-weight="600" fill="#5f5540">What goes in - all of it free and global</text><rect x="40" y="90" width="330" height="88" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="56" y="113" font-size="12.2" font-weight="600" fill="#2a2216">Sentinel-2 imagery</text><text x="56" y="130" font-size="10.1" fill="#5f5540">10 m dry-season composites,</text><text x="56" y="147" font-size="10.1" fill="#5f5540">refreshed every five days;</text><text x="56" y="164" font-size="10.1" fill="#5f5540">both detectors read it</text><rect x="410" y="90" width="330" height="88" rx="8" fill="#faf6ec" stroke="#1f9b8a" stroke-width="1.8"/><text x="426" y="113" font-size="12.2" font-weight="600" fill="#2a2216">OpenStreetMap solar</text><text x="426" y="130" font-size="10.1" fill="#5f5540">hand-mapped installations:</text><text x="426" y="147" font-size="10.1" fill="#5f5540">training labels, and counted</text><text x="426" y="164" font-size="10.1" fill="#5f5540">directly in the atlas</text><rect x="780" y="90" width="330" height="88" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="796" y="113" font-size="12.2" font-weight="600" fill="#2a2216">Building footprints</text><text x="796" y="130" font-size="10.1" fill="#5f5540">VIDA (Google + Microsoft):</text><text x="796" y="147" font-size="10.1" fill="#5f5540">every roof, including small</text><text x="796" y="164" font-size="10.1" fill="#5f5540">unmapped ones</text><text x="40" y="232" font-size="11.3" font-weight="600" fill="#5f5540">Two detectors</text><rect x="40" y="238" width="490" height="88" rx="8" fill="#faf6ec" stroke="#1c6fa8" stroke-width="1.8"/><text x="56" y="261" font-size="12.2" font-weight="600" fill="#2a2216">Segmentation (TerraMind fine-tune)</text><text x="56" y="278" font-size="10.1" fill="#5f5540">outlines individual arrays ≥ 400 m² directly in the pixels;</text><text x="56" y="295" font-size="10.1" fill="#5f5540">the only instrument for ground-mount PV at any size,</text><text x="56" y="312" font-size="10.1" fill="#5f5540">and the source of every human-checkable mapping lead</text><rect x="620" y="238" width="490" height="88" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="636" y="261" font-size="12.2" font-weight="600" fill="#2a2216">roofclf, cross-checked with SPPI</text><text x="636" y="278" font-size="10.1" fill="#5f5540">asks "does this roof carry PV?" for every building;</text><text x="636" y="295" font-size="10.1" fill="#5f5540">the only instrument below 400 m², and the better</text><text x="636" y="312" font-size="10.1" fill="#5f5540">rooftop one wherever it has been calibrated</text><text x="40" y="380" font-size="11.3" font-weight="600" fill="#5f5540">Calibration</text><rect x="40" y="386" width="330" height="88" rx="8" fill="#faf6ec" stroke="#1c6fa8" stroke-width="1.8"/><text x="56" y="409" font-size="12.2" font-weight="600" fill="#2a2216">Precision + recall calibration</text><text x="56" y="426" font-size="10.1" fill="#5f5540">each detection weighted by</text><text x="56" y="443" font-size="10.1" fill="#5f5540">measured P(real | size, glint,</text><text x="56" y="460" font-size="10.1" fill="#5f5540">placement), then recall-corrected</text><rect x="410" y="386" width="330" height="88" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="426" y="409" font-size="12.2" font-weight="600" fill="#2a2216">Ground truth: 30 quadrats</text><text x="426" y="426" font-size="10.1" fill="#5f5540">hand-mapped boxes with every</text><text x="426" y="443" font-size="10.1" fill="#5f5540">visible panel traced; the</text><text x="426" y="460" font-size="10.1" fill="#5f5540">measuring stick for both sides</text><rect x="780" y="386" width="330" height="88" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="796" y="409" font-size="12.2" font-weight="600" fill="#2a2216">Coverage ratio + area recall</text><text x="796" y="426" font-size="10.1" fill="#5f5540">fit per building size and density</text><text x="796" y="443" font-size="10.1" fill="#5f5540">stratum; trusted only where cell density</text><text x="796" y="460" font-size="10.1" fill="#5f5540">matches: 66% of cells, 95% of buildings</text><text x="40" y="528" font-size="11.3" font-weight="600" fill="#5f5540">Combined, never double-counted</text><rect x="255" y="534" width="640" height="122" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="271" y="557" font-size="12.2" font-weight="600" fill="#2a2216">One best instrument per component</text><text x="271" y="574" font-size="10.1" fill="#5f5540">ground-mount at any size: segmentation</text><text x="271" y="591" font-size="10.1" fill="#5f5540">rooftop ≥ 400 m²: roofclf inside its calibrated cells, segmentation elsewhere</text><text x="271" y="608" font-size="10.1" fill="#5f5540">rooftop &lt; 400 m²: roofclf, cross-checked with SPPI</text><text x="271" y="625" font-size="10.1" fill="#5f5540">hand-mapped OSM counts first; detections overlapping it are removed</text><text x="271" y="642" font-size="10.1" fill="#5f5540">each cell floored at OSM plus the stricter roofclf-AND-SPPI agreement</text><text x="40" y="710" font-size="11.3" font-weight="600" fill="#5f5540">Published output</text><rect x="325" y="716" width="500" height="64" rx="8" fill="#faf6ec" stroke="#1f9b8a" stroke-width="1.8"/><text x="341" y="739" font-size="12.2" font-weight="600" fill="#2a2216">Evidence atlas</text><text x="341" y="756" font-size="10.1" fill="#5f5540">Best estimate 18,827 MWp, 90% range 16,022 - 24,358,</text><text x="341" y="773" font-size="10.1" fill="#5f5540">per 0.1° cell and province, with the size split made explicit</text><text x="40" y="816" font-size="9.6" font-style="italic" fill="#5f5540">Hand-mapped OSM also flows into the combine step directly, as its own component and as part of the per-cell floor (long arrow omitted for clarity).</text><text x="40" y="834" font-size="9.6" font-style="italic" fill="#5f5540">Blue = segmentation path, orange = roofclf path, teal = hand-mapped OpenStreetMap - the same colours the atlas composition chart uses for these sources.</text><text x="40" y="852" font-size="9.6" font-style="italic" fill="#5f5540">The 90% range composes the measured calibration uncertainties above instead of hiding them; the headline is a modelled estimate, not a metered figure.</text><path d="M205,178 V208 H285 V238" stroke="#1c6fa8" stroke-width="1.7" fill="none" marker-end="url(#ah-1c6fa8-light)"/><path d="M205,178 V208 H865 V238" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><path d="M575,178 V208 H285 V238" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><text x="430" y="202" font-size="9.2" fill="#5f5540" text-anchor="middle">training labels</text><path d="M945,178 V208 H865 V238" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><text x="905" y="202" font-size="9.2" fill="#5f5540" text-anchor="middle">one row per roof</text><path d="M285,326 V356 H205 V386" stroke="#1c6fa8" stroke-width="1.7" fill="none" marker-end="url(#ah-1c6fa8-light)"/><path d="M865,326 V356 H945 V386" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><path d="M410,430 H370" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M740,430 H780" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M205,474 V504 H575 V534" stroke="#1c6fa8" stroke-width="1.7" fill="none" marker-end="url(#ah-1c6fa8-light)"/><path d="M945,474 V504 H575 V534" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><path d="M575,656 V686 H575 V716" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/></svg>