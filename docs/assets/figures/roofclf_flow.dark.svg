<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1064" viewBox="0 0 1200 1064" font-family="DejaVu Sans, system-ui, sans-serif"><defs><marker id="ah-c9bda4-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9bda4"/></marker><marker id="ah-f5a623-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/></marker><marker id="ah-4fb2e8-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fb2e8"/></marker><marker id="ah-2fd9c4-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2fd9c4"/></marker></defs><rect width="1200" height="1064" rx="10" fill="#100d09"/><text x="40" y="38" font-size="17.5" font-weight="600" fill="#f7f1e6">roofclf: from a hand-mapped square kilometre to a national capacity number</text><text x="40" y="60" font-size="12" fill="#c9bda4">One question per building: does this roof carry PV. Asked exactly where the segmentation model cannot outline anything.</text><rect x="40" y="100" width="340" height="86" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="56" y="123" font-size="12.2" font-weight="600" fill="#f7f1e6">Calibration quadrat</text><text x="56" y="140" font-size="10.1" fill="#c9bda4">a boundary a mapper declared</text><text x="56" y="157" font-size="10.1" fill="#c9bda4">Rule-1 complete: every visible</text><text x="56" y="174" font-size="10.1" fill="#c9bda4">panel inside it is mapped</text><rect x="430" y="100" width="340" height="86" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="446" y="123" font-size="12.2" font-weight="600" fill="#f7f1e6">VIDA building footprints</text><text x="446" y="140" font-size="10.1" fill="#c9bda4">every roof inside the boundary,</text><text x="446" y="157" font-size="10.1" fill="#c9bda4">including the sub-pixel ones</text><text x="446" y="174" font-size="10.1" fill="#c9bda4">OSM has never mapped</text><rect x="820" y="100" width="340" height="86" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="836" y="123" font-size="12.2" font-weight="600" fill="#f7f1e6">Sentinel-2 composite</text><text x="836" y="140" font-size="10.1" fill="#c9bda4">the same 10-band dry-season</text><text x="836" y="157" font-size="10.1" fill="#c9bda4">median the segmentation model</text><text x="836" y="174" font-size="10.1" fill="#c9bda4">reads. No new imagery</text><rect x="40" y="240" width="520" height="92" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="56" y="263" font-size="12.2" font-weight="600" fill="#f7f1e6">Label: has_pv</text><text x="56" y="280" font-size="10.1" fill="#c9bda4">mapped PV covering 5% or more of</text><text x="56" y="297" font-size="10.1" fill="#c9bda4">the footprint is a positive; every</text><text x="56" y="314" font-size="10.1" fill="#c9bda4">other roof is a TRUE negative</text><rect x="640" y="240" width="520" height="92" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="656" y="263" font-size="12.2" font-weight="600" fill="#f7f1e6">Features</text><text x="656" y="280" font-size="10.1" fill="#c9bda4">log roof area, plus the 10 band</text><text x="656" y="297" font-size="10.1" fill="#c9bda4">means over the polygon and NDVI,</text><text x="656" y="314" font-size="10.1" fill="#c9bda4">NDBI, brightness and two ratios</text><rect x="40" y="402" width="353" height="104" rx="8" fill="#1a160f" stroke="#f5a623" stroke-width="1.8"/><text x="56" y="425" font-size="12.2" font-weight="600" fill="#f7f1e6">L2 logistic regression</text><text x="56" y="442" font-size="10.1" fill="#c9bda4">scipy L-BFGS on standardised</text><text x="56" y="459" font-size="10.1" fill="#c9bda4">features. Linear on purpose: the</text><text x="56" y="476" font-size="10.1" fill="#c9bda4">output is summed, not thresholded</text><rect x="423" y="402" width="353" height="104" rx="8" fill="#1a160f" stroke="#f5a623" stroke-width="1.8"/><text x="439" y="425" font-size="12.2" font-weight="600" fill="#f7f1e6">Leave one quadrat out</text><text x="439" y="442" font-size="10.1" fill="#c9bda4">27 folds, each scored by a model</text><text x="439" y="459" font-size="10.1" fill="#c9bda4">that never saw it: 0.874 AUC,</text><text x="439" y="476" font-size="10.1" fill="#c9bda4">0.831 within roof-size band</text><rect x="807" y="402" width="353" height="104" rx="8" fill="#1a160f" stroke="#f5a623" stroke-width="1.8"/><text x="823" y="425" font-size="12.2" font-weight="600" fill="#f7f1e6">Deployment threshold</text><text x="823" y="442" font-size="10.1" fill="#c9bda4">p &gt;= 0.2535, chosen on pooled</text><text x="823" y="459" font-size="10.1" fill="#c9bda4">held-out scores for precision 0.50</text><text x="823" y="476" font-size="10.1" fill="#c9bda4">at recall 0.63</text><rect x="40" y="580" width="1120" height="88" rx="8" fill="#1a160f" stroke="#f5a623" stroke-width="1.8"/><text x="56" y="603" font-size="12.2" font-weight="600" fill="#f7f1e6">Every VIDA building, one 0.1 degree cell at a time</text><text x="56" y="620" font-size="10.1" fill="#c9bda4">75.7M buildings get a p_roofclf, and SPPI from the same five bands at no extra read cost.</text><text x="56" y="637" font-size="10.1" fill="#c9bda4">Composite fill pixels are masked out, and overlapping tiles are deduped onto one canonical cell,</text><text x="56" y="654" font-size="10.1" fill="#c9bda4">because both once turned into millions of false positives along cell edges.</text><rect x="40" y="714" width="353" height="108" rx="8" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.8"/><text x="56" y="737" font-size="12.2" font-weight="600" fill="#f7f1e6">Restrict to a known domain</text><text x="56" y="754" font-size="10.1" fill="#c9bda4">keep only cells whose building</text><text x="56" y="771" font-size="10.1" fill="#c9bda4">density falls in the quadrats'</text><text x="56" y="788" font-size="10.1" fill="#c9bda4">own range: 2,957 of 4,463 cells</text><rect x="423" y="714" width="353" height="108" rx="8" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.8"/><text x="439" y="737" font-size="12.2" font-weight="600" fill="#f7f1e6">Remove what is already counted</text><text x="439" y="754" font-size="10.1" fill="#c9bda4">drop any flagged building within</text><text x="439" y="771" font-size="10.1" fill="#c9bda4">30 m of an existing detection or</text><text x="439" y="788" font-size="10.1" fill="#c9bda4">a mapped OSM installation</text><rect x="807" y="714" width="353" height="108" rx="8" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.8"/><text x="823" y="737" font-size="12.2" font-weight="600" fill="#f7f1e6">Roof area to MWp</text><text x="823" y="754" font-size="10.1" fill="#c9bda4">a coverage ratio measured per</text><text x="823" y="771" font-size="10.1" fill="#c9bda4">roof-size bin and density band,</text><text x="823" y="788" font-size="10.1" fill="#c9bda4">then the module kWp constant</text><rect x="40" y="894" width="1120" height="94" rx="8" fill="#1a160f" stroke="#f5a623" stroke-width="1.8"/><text x="56" y="917" font-size="12.2" font-weight="600" fill="#f7f1e6">Best estimate</text><text x="56" y="934" font-size="10.1" fill="#c9bda4">roofclf alone in domain 9,202 MWp, plus 7,405 MWp of &gt;= 400 m2 roofs -- floored per cell at hand-mapped OSM plus the stricter 2,647 MWp roofclf-AND-SPPI population, two instruments that share no training data</text><path d="M210,186 V198 H300 V240" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M600,186 V198 H300 V240" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M600,186 V198 H900 V240" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M990,186 V198 H900 V240" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M300,332 V344 H217 V402" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M900,332 V344 H217 V402" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M393,454 H423" stroke="#f5a623" stroke-width="1.7" fill="none" marker-end="url(#ah-f5a623-dark)"/><path d="M777,454 H807" stroke="#f5a623" stroke-width="1.7" fill="none" marker-end="url(#ah-f5a623-dark)"/><path d="M983,506 V518 H600 V580" stroke="#f5a623" stroke-width="1.7" fill="none" marker-end="url(#ah-f5a623-dark)"/><path d="M600,668 V680 H217 V714" stroke="#2fd9c4" stroke-width="1.7" fill="none" marker-end="url(#ah-2fd9c4-dark)"/><path d="M393,768 H423" stroke="#2fd9c4" stroke-width="1.7" fill="none" marker-end="url(#ah-2fd9c4-dark)"/><path d="M777,768 H807" stroke="#2fd9c4" stroke-width="1.7" fill="none" marker-end="url(#ah-2fd9c4-dark)"/><path d="M983,822 V834 H600 V894" stroke="#f5a623" stroke-width="1.7" fill="none" marker-end="url(#ah-f5a623-dark)"/><rect x="36" y="81" width="207" height="15" fill="#100d09"/><text x="40" y="92" font-size="11.3" font-weight="600" fill="#c9bda4">1. Inputs, per calibration quadrat</text><rect x="36" y="221" width="293" height="15" fill="#100d09"/><text x="40" y="232" font-size="11.3" font-weight="600" fill="#c9bda4">2. One row per building (roofclf.building_table)</text><rect x="36" y="353" width="736" height="13" fill="#100d09"/><text x="40" y="362" font-size="9.6" font-style="italic" fill="#c9bda4">A no-PV building only counts as a negative because the quadrat is exhaustively mapped. Ordinary OpenStreetMap cannot supply that below 400 m2.</text><rect x="36" y="383" width="323" height="15" fill="#100d09"/><text x="40" y="394" font-size="11.3" font-weight="600" fill="#c9bda4">3. Fit and measure honestly (earthpv roof-classifier)</text><rect x="36" y="531" width="715" height="13" fill="#100d09"/><text x="40" y="540" font-size="9.6" font-style="italic" fill="#c9bda4">Folds are spatial by construction. A random split would put neighbouring roofs in train and test and report skill the model does not have.</text><rect x="36" y="561" width="323" height="15" fill="#100d09"/><text x="40" y="572" font-size="11.3" font-weight="600" fill="#c9bda4">4. Score the country (earthpv roofclf-score-national)</text><rect x="36" y="695" width="445" height="15" fill="#100d09"/><text x="40" y="706" font-size="11.3" font-weight="600" fill="#c9bda4">5. Probability to capacity (earthpv sub400-capacity, ge400-roof-capacity)</text><rect x="36" y="847" width="845" height="13" fill="#100d09"/><text x="40" y="856" font-size="9.6" font-style="italic" fill="#c9bda4">Panels cover only part of a flagged roof. Assuming otherwise overstated this estimate by 2.4 to 2.7x until the coverage ratio replaced precision as the multiplier.</text><rect x="36" y="875" width="159" height="15" fill="#100d09"/><text x="40" y="886" font-size="11.3" font-weight="600" fill="#c9bda4">6. Into the evidence atlas</text><rect x="36" y="1011" width="778" height="13" fill="#100d09"/><text x="40" y="1020" font-size="9.6" font-style="italic" fill="#c9bda4">roofclf also REPLACES the segmentation model's own rooftop estimate for buildings at or above 400 m2 inside the same domain, where it measures better.</text><rect x="36" y="1029" width="601" height="13" fill="#100d09"/><text x="40" y="1038" font-size="9.6" font-style="italic" fill="#c9bda4">Warm outline = the roofclf trunk. Teal = the calibration steps that decide where roofclf is allowed to speak at all.</text></svg>