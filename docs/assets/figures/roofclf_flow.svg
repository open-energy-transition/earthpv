<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1064" viewBox="0 0 1200 1064" font-family="DejaVu Sans, system-ui, sans-serif"><defs><marker id="ah-5f5540-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5540"/></marker><marker id="ah-c25e12-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c25e12"/></marker><marker id="ah-1c6fa8-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c6fa8"/></marker><marker id="ah-1f9b8a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9b8a"/></marker></defs><rect width="1200" height="1064" rx="10" fill="#f1ebdd"/><text x="40" y="38" font-size="17.5" font-weight="600" fill="#2a2216">roofclf: from a hand-mapped square kilometre to a national capacity number</text><text x="40" y="60" font-size="12" fill="#5f5540">One question per building: does this roof carry PV. Asked exactly where the segmentation model cannot outline anything.</text><rect x="40" y="100" width="340" height="86" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="56" y="123" font-size="12.2" font-weight="600" fill="#2a2216">Calibration quadrat</text><text x="56" y="140" font-size="10.1" fill="#5f5540">a boundary a mapper declared</text><text x="56" y="157" font-size="10.1" fill="#5f5540">Rule-1 complete: every visible</text><text x="56" y="174" font-size="10.1" fill="#5f5540">panel inside it is mapped</text><rect x="430" y="100" width="340" height="86" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="446" y="123" font-size="12.2" font-weight="600" fill="#2a2216">VIDA building footprints</text><text x="446" y="140" font-size="10.1" fill="#5f5540">every roof inside the boundary,</text><text x="446" y="157" font-size="10.1" fill="#5f5540">including the sub-pixel ones</text><text x="446" y="174" font-size="10.1" fill="#5f5540">OSM has never mapped</text><rect x="820" y="100" width="340" height="86" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="836" y="123" font-size="12.2" font-weight="600" fill="#2a2216">Sentinel-2 composite</text><text x="836" y="140" font-size="10.1" fill="#5f5540">the same 10-band dry-season</text><text x="836" y="157" font-size="10.1" fill="#5f5540">median the segmentation model</text><text x="836" y="174" font-size="10.1" fill="#5f5540">reads. No new imagery</text><rect x="40" y="240" width="520" height="92" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="56" y="263" font-size="12.2" font-weight="600" fill="#2a2216">Label: has_pv</text><text x="56" y="280" font-size="10.1" fill="#5f5540">mapped PV covering 5% or more of</text><text x="56" y="297" font-size="10.1" fill="#5f5540">the footprint is a positive; every</text><text x="56" y="314" font-size="10.1" fill="#5f5540">other roof is a TRUE negative</text><rect x="640" y="240" width="520" height="92" rx="8" fill="#faf6ec" stroke="#cfc0a5" stroke-width="1.1"/><text x="656" y="263" font-size="12.2" font-weight="600" fill="#2a2216">Features</text><text x="656" y="280" font-size="10.1" fill="#5f5540">log roof area, plus the 10 band</text><text x="656" y="297" font-size="10.1" fill="#5f5540">means over the polygon and NDVI,</text><text x="656" y="314" font-size="10.1" fill="#5f5540">NDBI, brightness and two ratios</text><rect x="40" y="402" width="353" height="104" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="56" y="425" font-size="12.2" font-weight="600" fill="#2a2216">L2 logistic regression</text><text x="56" y="442" font-size="10.1" fill="#5f5540">scipy L-BFGS on standardised</text><text x="56" y="459" font-size="10.1" fill="#5f5540">features. Linear on purpose: the</text><text x="56" y="476" font-size="10.1" fill="#5f5540">output is summed, not thresholded</text><rect x="423" y="402" width="353" height="104" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="439" y="425" font-size="12.2" font-weight="600" fill="#2a2216">Leave one quadrat out</text><text x="439" y="442" font-size="10.1" fill="#5f5540">27 folds, each scored by a model</text><text x="439" y="459" font-size="10.1" fill="#5f5540">that never saw it: 0.879 AUC,</text><text x="439" y="476" font-size="10.1" fill="#5f5540">0.834 within roof-size band</text><rect x="807" y="402" width="353" height="104" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="823" y="425" font-size="12.2" font-weight="600" fill="#2a2216">Deployment threshold</text><text x="823" y="442" font-size="10.1" fill="#5f5540">p &gt;= 0.2511, chosen on pooled</text><text x="823" y="459" font-size="10.1" fill="#5f5540">held-out scores for precision 0.50</text><text x="823" y="476" font-size="10.1" fill="#5f5540">at recall 0.63</text><rect x="40" y="580" width="1120" height="88" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="56" y="603" font-size="12.2" font-weight="600" fill="#2a2216">Every VIDA building, one 0.1 degree cell at a time</text><text x="56" y="620" font-size="10.1" fill="#5f5540">75.7M buildings get a p_roofclf, and SPPI from the same five bands at no extra read cost.</text><text x="56" y="637" font-size="10.1" fill="#5f5540">Composite fill pixels are masked out, and overlapping tiles are deduped onto one canonical cell,</text><text x="56" y="654" font-size="10.1" fill="#5f5540">because both once turned into millions of false positives along cell edges.</text><rect x="40" y="714" width="353" height="108" rx="8" fill="#faf6ec" stroke="#1f9b8a" stroke-width="1.8"/><text x="56" y="737" font-size="12.2" font-weight="600" fill="#2a2216">Restrict to a known domain</text><text x="56" y="754" font-size="10.1" fill="#5f5540">keep only cells whose building</text><text x="56" y="771" font-size="10.1" fill="#5f5540">density falls in the quadrats'</text><text x="56" y="788" font-size="10.1" fill="#5f5540">own range: 2,957 of 4,463 cells</text><rect x="423" y="714" width="353" height="108" rx="8" fill="#faf6ec" stroke="#1f9b8a" stroke-width="1.8"/><text x="439" y="737" font-size="12.2" font-weight="600" fill="#2a2216">Remove what is already counted</text><text x="439" y="754" font-size="10.1" fill="#5f5540">drop any flagged building within</text><text x="439" y="771" font-size="10.1" fill="#5f5540">30 m of an existing detection or</text><text x="439" y="788" font-size="10.1" fill="#5f5540">a mapped OSM installation</text><rect x="807" y="714" width="353" height="108" rx="8" fill="#faf6ec" stroke="#1f9b8a" stroke-width="1.8"/><text x="823" y="737" font-size="12.2" font-weight="600" fill="#2a2216">Roof area to MWp</text><text x="823" y="754" font-size="10.1" fill="#5f5540">a coverage ratio measured per</text><text x="823" y="771" font-size="10.1" fill="#5f5540">roof-size bin and density band,</text><text x="823" y="788" font-size="10.1" fill="#5f5540">then the module kWp constant</text><rect x="40" y="894" width="1120" height="94" rx="8" fill="#faf6ec" stroke="#c25e12" stroke-width="1.8"/><text x="56" y="917" font-size="12.2" font-weight="600" fill="#2a2216">Best estimate</text><text x="56" y="934" font-size="10.1" fill="#5f5540">roofclf alone in domain 7,890 MWp, plus 7,189 MWp of &gt;= 400 m2 roofs, plus 62 MWp extrapolated outside it -- floored per cell at hand-mapped OSM plus the stricter 2,180 MWp roofclf-AND-SPPI population, two instruments that share no training data</text><path d="M210,186 V198 H300 V240" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M600,186 V198 H300 V240" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M600,186 V198 H900 V240" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M990,186 V198 H900 V240" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M300,332 V344 H217 V402" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M900,332 V344 H217 V402" stroke="#5f5540" stroke-width="1.7" fill="none" marker-end="url(#ah-5f5540-light)"/><path d="M393,454 H423" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><path d="M777,454 H807" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><path d="M983,506 V518 H600 V580" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><path d="M600,668 V680 H217 V714" stroke="#1f9b8a" stroke-width="1.7" fill="none" marker-end="url(#ah-1f9b8a-light)"/><path d="M393,768 H423" stroke="#1f9b8a" stroke-width="1.7" fill="none" marker-end="url(#ah-1f9b8a-light)"/><path d="M777,768 H807" stroke="#1f9b8a" stroke-width="1.7" fill="none" marker-end="url(#ah-1f9b8a-light)"/><path d="M983,822 V834 H600 V894" stroke="#c25e12" stroke-width="1.7" fill="none" marker-end="url(#ah-c25e12-light)"/><rect x="36" y="81" width="207" height="15" fill="#f1ebdd"/><text x="40" y="92" font-size="11.3" font-weight="600" fill="#5f5540">1. Inputs, per calibration quadrat</text><rect x="36" y="221" width="293" height="15" fill="#f1ebdd"/><text x="40" y="232" font-size="11.3" font-weight="600" fill="#5f5540">2. One row per building (roofclf.building_table)</text><rect x="36" y="353" width="736" height="13" fill="#f1ebdd"/><text x="40" y="362" font-size="9.6" font-style="italic" fill="#5f5540">A no-PV building only counts as a negative because the quadrat is exhaustively mapped. Ordinary OpenStreetMap cannot supply that below 400 m2.</text><rect x="36" y="383" width="323" height="15" fill="#f1ebdd"/><text x="40" y="394" font-size="11.3" font-weight="600" fill="#5f5540">3. Fit and measure honestly (earthpv roof-classifier)</text><rect x="36" y="531" width="715" height="13" fill="#f1ebdd"/><text x="40" y="540" font-size="9.6" font-style="italic" fill="#5f5540">Folds are spatial by construction. A random split would put neighbouring roofs in train and test and report skill the model does not have.</text><rect x="36" y="561" width="323" height="15" fill="#f1ebdd"/><text x="40" y="572" font-size="11.3" font-weight="600" fill="#5f5540">4. Score the country (earthpv roofclf-score-national)</text><rect x="36" y="695" width="445" height="15" fill="#f1ebdd"/><text x="40" y="706" font-size="11.3" font-weight="600" fill="#5f5540">5. Probability to capacity (earthpv sub400-capacity, ge400-roof-capacity)</text><rect x="36" y="847" width="845" height="13" fill="#f1ebdd"/><text x="40" y="856" font-size="9.6" font-style="italic" fill="#5f5540">Panels cover only part of a flagged roof. Assuming otherwise overstated this estimate by 2.4 to 2.7x until the coverage ratio replaced precision as the multiplier.</text><rect x="36" y="875" width="159" height="15" fill="#f1ebdd"/><text x="40" y="886" font-size="11.3" font-weight="600" fill="#5f5540">6. Into the evidence atlas</text><rect x="36" y="1011" width="778" height="13" fill="#f1ebdd"/><text x="40" y="1020" font-size="9.6" font-style="italic" fill="#5f5540">roofclf also REPLACES the segmentation model's own rooftop estimate for buildings at or above 400 m2 inside the same domain, where it measures better.</text><rect x="36" y="1029" width="601" height="13" fill="#f1ebdd"/><text x="40" y="1038" font-size="9.6" font-style="italic" fill="#5f5540">Warm outline = the roofclf trunk. Teal = the calibration steps that decide where roofclf is allowed to speak at all.</text></svg>