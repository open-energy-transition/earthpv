<svg xmlns="http://www.w3.org/2000/svg" width="760" height="689" viewBox="0 0 760 689" font-family="DejaVu Sans, system-ui, sans-serif"><defs><marker id="ah-c9bda4-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9bda4"/></marker><marker id="ah-f5a623-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/></marker><marker id="ah-4fb2e8-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fb2e8"/></marker><marker id="ah-2fd9c4-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2fd9c4"/></marker></defs><rect width="760" height="689" rx="10" fill="#100d09"/><text x="24" y="36" font-size="18.5" font-weight="600" fill="#f7f1e6">The mapping flywheel</text><text x="24" y="59" font-size="13" fill="#c9bda4" text-anchor="start">Each turn leaves the map more complete and the models more local.</text><rect x="12" y="78" width="736" height="513" rx="12" fill="none" stroke="#c9bda4" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="26" y="68" width="118" height="20" fill="#100d09"/><text x="34" y="83" font-size="12.5" fill="#f7f1e6" text-anchor="start" font-weight="600">LLM assistant</text><path d="M622.6,341.6 A250,172 0 0 1 137.4,341.6" fill="none" stroke="#2fd9c4" stroke-opacity="0.16" stroke-width="78" stroke-linecap="round"/><path d="M498.4,148.5 A250,172 0 0 1 559.0,179.9" fill="none" stroke="#c9bda4" stroke-width="2.2" marker-end="url(#ah-c9bda4-dark)"/><path d="M618.4,248.2 A250,172 0 0 1 618.4,351.8" fill="none" stroke="#c9bda4" stroke-width="2.2" marker-end="url(#ah-c9bda4-dark)"/><path d="M559.0,420.1 A250,172 0 0 1 498.4,451.5" fill="none" stroke="#c9bda4" stroke-width="2.2" marker-end="url(#ah-c9bda4-dark)"/><path d="M261.6,451.5 A250,172 0 0 1 201.0,420.1" fill="none" stroke="#c9bda4" stroke-width="2.2" marker-end="url(#ah-c9bda4-dark)"/><path d="M141.6,351.8 A250,172 0 0 1 141.6,248.2" fill="none" stroke="#c9bda4" stroke-width="2.2" marker-end="url(#ah-c9bda4-dark)"/><path d="M201.0,179.9 A250,172 0 0 1 261.6,148.5" fill="none" stroke="#c9bda4" stroke-width="2.2" marker-end="url(#ah-c9bda4-dark)"/><path d="M521.1,356.0 L453.4,329.2" stroke="#2fd9c4" stroke-width="2.2" marker-end="url(#ah-2fd9c4-dark)"/><path d="M380.0,437.0 L380.0,379.0" stroke="#2fd9c4" stroke-width="2.2" marker-end="url(#ah-2fd9c4-dark)"/><path d="M306.6,270.8 L238.9,244.0" stroke="#2fd9c4" stroke-width="2.2" marker-end="url(#ah-2fd9c4-dark)"/><path d="M453.4,270.8 L521.1,244.0" stroke="#2fd9c4" stroke-width="2.2" marker-end="url(#ah-2fd9c4-dark)"/><circle cx="380" cy="300" r="72" fill="#1a160f" stroke="#2fd9c4" stroke-width="2.2"/><text x="380" y="294" font-size="14.5" fill="#2fd9c4" text-anchor="middle" font-weight="600">OpenStreetMap</text><text x="380" y="314" font-size="11" fill="#c9bda4" text-anchor="middle">every checked panel,</text><text x="380" y="328" font-size="11" fill="#c9bda4" text-anchor="middle">openly licensed</text><rect x="269.0" y="101.0" width="222" height="54" rx="9" fill="#1a160f" stroke="#3a2d16" stroke-width="1.4"/><circle cx="291.0" cy="128.0" r="13" fill="none" stroke="#f7f1e6" stroke-width="1.4"/><text x="291" y="133" font-size="13" fill="#f7f1e6" text-anchor="middle" font-weight="600">1</text><text x="313" y="125" font-size="13.5" fill="#f7f1e6" text-anchor="start" font-weight="600">Detect from space</text><text x="313" y="143" font-size="11.5" fill="#c9bda4" text-anchor="start">Sentinel-2, open models</text><rect x="485.5" y="187.0" width="222" height="54" rx="9" fill="#1a160f" stroke="#3a2d16" stroke-width="1.4"/><circle cx="507.5" cy="214.0" r="13" fill="none" stroke="#f7f1e6" stroke-width="1.4"/><text x="508" y="219" font-size="13" fill="#f7f1e6" text-anchor="middle" font-weight="600">2</text><text x="530" y="211" font-size="13.5" fill="#f7f1e6" text-anchor="start" font-weight="600">Publish the atlas</text><text x="530" y="229" font-size="11.5" fill="#c9bda4" text-anchor="start">estimate, leads, areas</text><rect x="485.5" y="359.0" width="222" height="54" rx="9" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.4"/><circle cx="507.5" cy="386.0" r="13" fill="none" stroke="#f7f1e6" stroke-width="1.4"/><text x="508" y="391" font-size="13" fill="#f7f1e6" text-anchor="middle" font-weight="600">3</text><text x="530" y="383" font-size="13.5" fill="#f7f1e6" text-anchor="start" font-weight="600">Map the leads</text><text x="530" y="401" font-size="11.5" fill="#c9bda4" text-anchor="start">arrays of 400 m² and up</text><rect x="269.0" y="445.0" width="222" height="54" rx="9" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.4"/><circle cx="291.0" cy="472.0" r="13" fill="none" stroke="#f7f1e6" stroke-width="1.4"/><text x="291" y="477" font-size="13" fill="#f7f1e6" text-anchor="middle" font-weight="600">4</text><text x="313" y="469" font-size="13.5" fill="#f7f1e6" text-anchor="start" font-weight="600">Map calibration areas</text><text x="313" y="487" font-size="11.5" fill="#c9bda4" text-anchor="start">every panel inside the line</text><rect x="52.5" y="359.0" width="222" height="54" rx="9" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.4"/><circle cx="74.5" cy="386.0" r="13" fill="none" stroke="#f7f1e6" stroke-width="1.4"/><text x="74" y="391" font-size="13" fill="#f7f1e6" text-anchor="middle" font-weight="600">5</text><text x="96" y="383" font-size="13.5" fill="#f7f1e6" text-anchor="start" font-weight="600">Local datasets</text><text x="96" y="401" font-size="11.5" fill="#c9bda4" text-anchor="start">registers, statistics</text><rect x="52.5" y="187.0" width="222" height="54" rx="9" fill="#1a160f" stroke="#3a2d16" stroke-width="1.4"/><circle cx="74.5" cy="214.0" r="13" fill="none" stroke="#f7f1e6" stroke-width="1.4"/><text x="74" y="219" font-size="13" fill="#f7f1e6" text-anchor="middle" font-weight="600">6</text><text x="96" y="211" font-size="13.5" fill="#f7f1e6" text-anchor="start" font-weight="600">Retrain, recalibrate</text><text x="96" y="229" font-size="11.5" fill="#c9bda4" text-anchor="start">on the new local labels</text><text x="380" y="537" font-size="12" fill="#c9bda4" text-anchor="middle">Runs the pipeline, finds and reads local data, prepares areas and review pages,</text><text x="380" y="555" font-size="12" fill="#f7f1e6" text-anchor="middle">answers mapping questions. It never edits OpenStreetMap or signs off a number: people do.</text><path d="M24,619.0 H54" stroke="#2fd9c4" stroke-width="2.2" marker-end="url(#ah-2fd9c4-dark)"/><text x="64" y="624" font-size="12" fill="#c9bda4" text-anchor="start">through OpenStreetMap: counted, and learned from</text><rect x="430" y="609.0" width="30" height="20" rx="10" fill="#2fd9c4" fill-opacity="0.16"/><text x="470" y="624" font-size="12" fill="#c9bda4" text-anchor="start">stations people do</text><text x="24" y="653" font-size="11.5" fill="#c9bda4" text-anchor="start">Only free, openly licensed imagery reaches the models. People read the high-resolution</text><text x="24" y="669" font-size="11.5" fill="#c9bda4" text-anchor="start">layers, inside the editor, where their licences allow it.</text></svg>