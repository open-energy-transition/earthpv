<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="988" viewBox="0 0 1200 988" font-family="DejaVu Sans, system-ui, sans-serif"><defs><marker id="ah-c9bda4-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9bda4"/></marker><marker id="ah-f5a623-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/></marker><marker id="ah-4fb2e8-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fb2e8"/></marker><marker id="ah-2fd9c4-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2fd9c4"/></marker></defs><rect width="1200" height="988" rx="10" fill="#100d09"/><text x="40" y="38" font-size="17.5" font-weight="600" fill="#f7f1e6">How raw data becomes a mapping lead and a capacity number</text><text x="40" y="60" font-size="12" fill="#c9bda4">Five instruments read the same Sentinel-2 composites and combine into two products: OpenStreetMap mapping leads and a calibrated capacity atlas.</text><text x="40" y="84" font-size="11.3" font-weight="600" fill="#c9bda4">Raw data</text><rect x="40" y="90" width="340" height="84" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="56" y="113" font-size="12.2" font-weight="600" fill="#f7f1e6">Sentinel-2 L2A</text><text x="56" y="130" font-size="10.1" fill="#c9bda4">10-band dry-season composites,</text><text x="56" y="147" font-size="10.1" fill="#c9bda4">reused per tile or built on demand</text><text x="56" y="164" font-size="10.1" fill="#c9bda4">by compose</text><rect x="430" y="90" width="340" height="84" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="446" y="113" font-size="12.2" font-weight="600" fill="#f7f1e6">OSM / Overture solar labels</text><text x="446" y="130" font-size="10.1" fill="#c9bda4">mapped installations, plus live</text><text x="446" y="147" font-size="10.1" fill="#c9bda4">Overpass pulls for new areas</text><rect x="820" y="90" width="340" height="84" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="836" y="113" font-size="12.2" font-weight="600" fill="#f7f1e6">VIDA / Overture buildings</text><text x="836" y="130" font-size="10.1" fill="#c9bda4">imagery-derived footprints,</text><text x="836" y="147" font-size="10.1" fill="#c9bda4">includes small unmapped roofs</text><text x="40" y="228" font-size="11.3" font-weight="600" fill="#c9bda4">Train</text><rect x="40" y="234" width="520" height="84" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="56" y="257" font-size="12.2" font-weight="600" fill="#f7f1e6">chips</text><text x="56" y="274" font-size="10.1" fill="#c9bda4">jittered positive windows,</text><text x="56" y="291" font-size="10.1" fill="#c9bda4">labels burned to per-pixel masks</text><rect x="640" y="234" width="520" height="84" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="656" y="257" font-size="12.2" font-weight="600" fill="#f7f1e6">TerraMind-tiny fine-tune</text><text x="656" y="274" font-size="10.1" fill="#c9bda4">TerraTorch + Lightning,</text><text x="656" y="291" font-size="10.1" fill="#c9bda4">checkpoint monitors val mIoU</text><text x="40" y="372" font-size="11.3" font-weight="600" fill="#c9bda4">Inference — five instruments, same Sentinel-2 imagery</text><rect x="40" y="378" width="208" height="106" rx="8" fill="#1a160f" stroke="#f5a623" stroke-width="1.8"/><text x="56" y="401" font-size="12.2" font-weight="600" fill="#f7f1e6">Segmentation raster</text><text x="56" y="418" font-size="10.1" fill="#c9bda4">infer: per-pixel PV</text><text x="56" y="435" font-size="10.1" fill="#c9bda4">probability, primary</text><text x="56" y="452" font-size="10.1" fill="#c9bda4">≥ 400 m² instrument</text><rect x="268" y="378" width="208" height="106" rx="8" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.8"/><text x="284" y="401" font-size="12.2" font-weight="600" fill="#f7f1e6">Fraction head</text><text x="284" y="418" font-size="10.1" fill="#c9bda4">alt checkpoint: per-pixel</text><text x="284" y="435" font-size="10.1" fill="#c9bda4">PV coverage fraction,</text><text x="284" y="452" font-size="10.1" fill="#c9bda4">drops the polygon</text><rect x="496" y="378" width="208" height="106" rx="8" fill="#1a160f" stroke="#4fb2e8" stroke-width="1.8"/><text x="512" y="401" font-size="12.2" font-weight="600" fill="#f7f1e6">Glint matched filter</text><text x="512" y="418" font-size="10.1" fill="#c9bda4">specular flash geometry,</text><text x="512" y="435" font-size="10.1" fill="#c9bda4">corroborates only</text><text x="512" y="452" font-size="10.1" fill="#c9bda4">(never demotes)</text><rect x="724" y="378" width="208" height="106" rx="8" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.8"/><text x="740" y="401" font-size="12.2" font-weight="600" fill="#f7f1e6">SPPI</text><text x="740" y="418" font-size="10.1" fill="#c9bda4">zero-training spectral</text><text x="740" y="435" font-size="10.1" fill="#c9bda4">index, cross-validated,</text><text x="740" y="452" font-size="10.1" fill="#c9bda4">no model fit</text><rect x="952" y="378" width="208" height="106" rx="8" fill="#1a160f" stroke="#f5a623" stroke-width="1.8"/><text x="968" y="401" font-size="12.2" font-weight="600" fill="#f7f1e6">roofclf</text><text x="968" y="418" font-size="10.1" fill="#c9bda4">per-building classifier:</text><text x="968" y="435" font-size="10.1" fill="#c9bda4">size + reflectance,</text><text x="968" y="452" font-size="10.1" fill="#c9bda4">calibration quadrats</text><text x="40" y="502" font-size="9.6" font-style="italic" fill="#c9bda4">Glint and SPPI read the composites directly, no model fit; segmentation and the fraction head share one TerraMind checkpoint; roofclf trains separately on calibration-quadrat labels.</text><text x="40" y="538" font-size="11.3" font-weight="600" fill="#c9bda4">Combine &amp; rank</text><rect x="40" y="544" width="340" height="100" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="56" y="567" font-size="12.2" font-weight="600" fill="#f7f1e6">postprocess</text><text x="56" y="584" font-size="10.1" fill="#c9bda4">polygonize, join to building</text><text x="56" y="601" font-size="10.1" fill="#c9bda4">footprint, rank_score for</text><text x="56" y="618" font-size="10.1" fill="#c9bda4">the leads queue</text><rect x="430" y="544" width="340" height="100" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="446" y="567" font-size="12.2" font-weight="600" fill="#f7f1e6">density</text><text x="446" y="584" font-size="10.1" fill="#c9bda4">per-building / cell / region</text><text x="446" y="601" font-size="10.1" fill="#c9bda4">MWp: _det / _exp / _cal,</text><text x="446" y="618" font-size="10.1" fill="#c9bda4">≥ 400 m² only</text><rect x="820" y="544" width="340" height="100" rx="8" fill="#1a160f" stroke="#3a2d16" stroke-width="1.1"/><text x="836" y="567" font-size="12.2" font-weight="600" fill="#f7f1e6">sub-400 m² bracket</text><text x="836" y="584" font-size="10.1" fill="#c9bda4">domain-restricted roofclf +</text><text x="836" y="601" font-size="10.1" fill="#c9bda4">SPPI AND-gate, building-</text><text x="836" y="618" font-size="10.1" fill="#c9bda4">density-matched cells</text><text x="40" y="664" font-size="11.3" font-weight="600" fill="#c9bda4">Plausibility gate</text><rect x="370" y="670" width="460" height="62" rx="8" fill="#1a160f" stroke="#4fb2e8" stroke-width="1.8"/><text x="386" y="693" font-size="12.2" font-weight="600" fill="#f7f1e6">check-density</text><text x="386" y="710" font-size="10.1" fill="#c9bda4">ground:rooftop capacity ratio + single-cell concentration checks</text><text x="40" y="780" font-size="11.3" font-weight="600" fill="#c9bda4">Outputs</text><rect x="40" y="786" width="265" height="94" rx="8" fill="#1a160f" stroke="#f5a623" stroke-width="1.8"/><text x="56" y="809" font-size="12.2" font-weight="600" fill="#f7f1e6">MapRoulette leads</text><text x="56" y="826" font-size="10.1" fill="#c9bda4">→ OpenStreetMap,</text><text x="56" y="843" font-size="10.1" fill="#c9bda4">a human verifies every</text><text x="56" y="860" font-size="10.1" fill="#c9bda4">candidate</text><rect x="325" y="786" width="265" height="94" rx="8" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.8"/><text x="341" y="809" font-size="12.2" font-weight="600" fill="#f7f1e6">Capacity atlas / dashboard</text><text x="341" y="826" font-size="10.1" fill="#c9bda4">MWp per building, cell</text><text x="341" y="843" font-size="10.1" fill="#c9bda4">and region, ≥ 400 m²</text><rect x="610" y="786" width="265" height="94" rx="8" fill="#1a160f" stroke="#2fd9c4" stroke-width="1.8"/><text x="626" y="809" font-size="12.2" font-weight="600" fill="#f7f1e6">PyPSA-Earth grid CSV</text><text x="626" y="826" font-size="10.1" fill="#c9bda4">0.1° cell capacity for</text><text x="626" y="843" font-size="10.1" fill="#c9bda4">power-system modelling</text><rect x="895" y="786" width="265" height="94" rx="8" fill="#1a160f" stroke="#4fb2e8" stroke-width="1.8"/><text x="911" y="809" font-size="12.2" font-weight="600" fill="#f7f1e6">Evidence atlas</text><text x="911" y="826" font-size="10.1" fill="#c9bda4">Best estimate, sub-400 m²</text><text x="911" y="843" font-size="10.1" fill="#c9bda4">plus ≥ 400 m²</text><text x="40" y="936" font-size="9.6" font-style="italic" fill="#c9bda4">Building footprints also feed roofclf and the sub-400 m² bracket directly (arrows omitted for clarity).</text><text x="40" y="954" font-size="9.6" font-style="italic" fill="#c9bda4">Solid grey = the main trunk. Blue = load-bearing instruments. Orange = glint, corroborates only. Aqua = auxiliary instruments not (yet) in the headline number.</text><path d="M210,174 V204 H300 V234" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M600,174 V204 H300 V234" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M560,276 H640" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M900,318 V348 H144 V378" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M144,484 V514 H210 V544" stroke="#f5a623" stroke-width="1.7" fill="none" marker-end="url(#ah-f5a623-dark)"/><path d="M144,484 V514 H600 V544" stroke="#f5a623" stroke-width="1.7" fill="none" marker-end="url(#ah-f5a623-dark)"/><path d="M372,484 V514 H600 V544" stroke="#2fd9c4" stroke-width="1.7" fill="none" marker-end="url(#ah-2fd9c4-dark)" stroke-dasharray="6,4"/><path d="M600,484 V514 H210 V544" stroke="#4fb2e8" stroke-width="1.7" fill="none" marker-end="url(#ah-4fb2e8-dark)"/><path d="M828,484 V514 H990 V544" stroke="#2fd9c4" stroke-width="1.7" fill="none" marker-end="url(#ah-2fd9c4-dark)"/><path d="M1056,484 V514 H990 V544" stroke="#f5a623" stroke-width="1.7" fill="none" marker-end="url(#ah-f5a623-dark)"/><path d="M210,644 V715 H172 V786" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M600,644 V657 H600 V670" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M600,732 V759 H458 V786" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M590,833 H610" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><path d="M458,880 V902 H1028 V880" stroke="#c9bda4" stroke-width="1.7" fill="none" marker-end="url(#ah-c9bda4-dark)"/><text x="742" y="915" font-size="9.2" fill="#c9bda4" text-anchor="middle">+ existing ≥ 400 m² total</text><path d="M990,644 V715 H1028 V786" stroke="#4fb2e8" stroke-width="1.7" fill="none" marker-end="url(#ah-4fb2e8-dark)"/><path d="M40,833 H18 V204 H600 V174" stroke="#4fb2e8" stroke-width="1.7" fill="none" marker-end="url(#ah-4fb2e8-dark)" stroke-dasharray="6,4"/><text x="309" y="197" font-size="9.2" fill="#4fb2e8" text-anchor="middle">verified leads become new training labels</text></svg>