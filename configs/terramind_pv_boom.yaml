# TerraTorch fine-tuning config for PV segmentation - BOOM-WINDOW stack (20-band).
# Same architecture as configs/terramind_pv_seasonal.yaml (that experiment stacked a
# same-year weather contrast and found no improvement); this one stacks the actual
# pre-boom epoch (2021-10 to 2022-01, before Pakistan's solar import boom) against the
# current composite instead, so - unlike the seasonal pair - there is a real adoption
# change between the two layers for the model to learn from. See configs/aoi.yaml's
# `punjab_boom` AOI and scripts/build_punjab_boom_composites.py.
#
# Deliberately Punjab-only (not merged with Germany like the seasonal run): Germany has
# no equivalent "pre-boom" epoch to contrast against, and merging would need its own
# separate contrast composite that doesn't correspond to anything real. This keeps the
# comparison to the seasonal result narrow and apples-to-apples on the one question that
# changed (the contrast window), at the cost of a smaller (Punjab-only) training set.

data:
  index_path: data/chips/punjab_boom/index.parquet
  batch_size: 8
  num_workers: 4

task:
  model_factory: EncoderDecoderFactory
  model_args:
    backbone: terramind_v1_tiny
    backbone_pretrained: true
    backbone_modalities: [S2L2A]
    # 10 band names x2 (current epoch, then pre-boom epoch)
    backbone_bands:
      S2L2A: [BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3,
              NIR_BROAD, NIR_NARROW, SWIR_1, SWIR_2,
              BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3,
              NIR_BROAD, NIR_NARROW, SWIR_1, SWIR_2]
    necks:
      - name: SelectIndices
        indices: [2, 5, 8, 11]
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
    decoder: UNetDecoder
    decoder_channels: [256, 128, 64, 32]
    num_classes: 2
    rescale: true
  loss: dice
  # Heavy class imbalance: tiny PV targets vs background.
  class_weights: [0.25, 0.75]
  ignore_index: -1
  lr: 1.0e-4
  optimizer: AdamW
  optimizer_hparams:
    weight_decay: 0.05
  freeze_backbone: false
  plot_on_val: false

trainer:
  max_epochs: 60
  accumulate_grad_batches: 2

checkpoint_dir: data/models
patience: 8
