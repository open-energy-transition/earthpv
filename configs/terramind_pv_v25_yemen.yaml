# TerraTorch fine-tuning config for PV segmentation -- v13's recipe and base corpus, on
# Yemen's 2026-11-01 OpenStreetMap labels.
#
# v13 (configs/terramind_pv_v13_yemen.yaml) was trained on the 2026-10-10 pull: 1,892
# features, almost all 2023 Tihama pump rectangles, and it found none of its held-out
# arrays. Since then the owner has mapped Yemen's model leads and its farm calibration areas
# (2,746 features by 2026-10-24, more by 2026-11-01). The only change is the Yemen chips,
# cut from that pull (scripts/run_yemen_v25.sh): same backbone, necks, decoder, loss, lr,
# schedule, monitor, patience and base corpus, Yemen's train rows repeated by the same rule
# (clamp(round(7000 / n_train), 1, 8)).
#
# Val holdout: unchanged, Yemen's `val_tiles` ('Amran, chosen from the label map before
# v13), with its one-cell buffer, so v13, v25 and v5 are scored on the same held-out region
# (scripts/compare_backbones.py). The owner's completely mapped Huth farm area lies inside
# it, so the holdout now holds far more arrays than v13's 25.
#
# resume: true continues from this run's own last.ckpt after a crash (the chain retries).

data:
  index_path: data/chips/combined_yemen_v25/index.parquet
  batch_size: 8
  num_workers: 4

task:
  model_factory: EncoderDecoderFactory
  model_args:
    # terramind_v1_tiny fits the GTX 1060; bump to _small if a bigger GPU is used.
    backbone: terramind_v1_tiny
    backbone_pretrained: true
    backbone_modalities: [S2L2A]
    backbone_bands:
      S2L2A: [BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3,
              NIR_BROAD, NIR_NARROW, SWIR_1, SWIR_2]
    necks:
      - name: SelectIndices
        indices: [2, 5, 8, 11]
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
    decoder: UNetDecoder
    decoder_channels: [256, 128, 64, 32]
    num_classes: 2
    rescale: true
  # Recall-first: Tversky with beta>alpha penalises false negatives (missed PV) harder
  # than false positives. gamma=1 = plain Tversky (no focal term).
  loss: tversky
  tversky_args: {alpha: 0.3, beta: 0.7, gamma: 1.0}
  class_weights: [0.25, 0.75]
  ignore_index: -1
  lr: 1.0e-4
  optimizer: AdamW
  optimizer_hparams:
    weight_decay: 0.05
  freeze_backbone: false
  plot_on_val: false

trainer:
  max_epochs: 60
  accumulate_grad_batches: 2

checkpoint_dir: data/models/v25_combined_yemen
patience: 8
# Same monitor as v5 (val/mIoU), so the two are selected the same way.
monitor: val/mIoU
monitor_mode: max
resume: true
