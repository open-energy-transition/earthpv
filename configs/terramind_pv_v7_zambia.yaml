# TerraTorch fine-tuning config for PV segmentation -- Germany + Pakistan + India + ZAMBIA.
#
# Identical recipe to configs/terramind_pv_v4_all.yaml (same backbone, necks, decoder,
# loss, lr, schedule, monitor metric). The only variable is the corpus: Zambia is added.
#
# WHY, AND WHAT TO EXPECT. The owner asked for the segmentation to be localised on local
# OpenStreetMap data. This config is that attempt, run as a MEASUREMENT against the v4
# zero-shot baseline rather than as an assumed improvement -- v6 (France capped to
# Germany's size) is the standing evidence that a half-measure retrain can land worse than
# zero-shot on both slope and recovery.
#
# Corpus (data/chips/combined_zambia/index.parquet, 6,853 chips,
# scripts/merge_chip_index.py germany punjab pakistan gujarat zambia:8):
#   germany : 3,189 chips (141 val, 2,173 with PV)      -- unchanged
#   punjab  : 274 chips (37 val, 218 with PV)           -- unchanged
#   pakistan: 2,438 chips (48 val, 1,593 with PV)       -- unchanged
#   gujarat : 760 chips (128 val, 381 with PV)          -- unchanged
#   zambia  : 24 chips x8 = 192 rows (8 val, 151 with PV)   -- NEW
#
# HOW SMALL THAT ACTUALLY IS, STATED PLAINLY. Zambia has 221 mapped OSM solar features,
# 127 at or above MIN_PV_AREA after six unbuilt `power=plant` perimeters were screened out
# (configs/zambia_osm_ground_exclusions.txt). `sample_chip_centers` then dedupes positives
# sharing a ~2 km cell, and Zambia's PV is concentrated in a handful of sites, so 127
# features collapse to **25 spatially distinct positives** -- 18 train, 7 val. There are
# **zero background chips**: the uniform background sample is drawn over the coverage
# BOUNDS and kept only where it lands inside a composited cell, and at the time of the
# build only 59 of 1,843 cells existed, so every background draw fell outside. The 6
# near-negatives (offset 3-6 km from a positive) are the entire negative contribution.
#
# So the thing this corpus can plausibly teach is what Zambian ground-mount looks like --
# and v4 already covers Bangweulu at 98.8% and Itimpi at 99.7% of imaged area zero-shot.
# What Zambia actually needs is HARD NEGATIVES (bright bare soil, burn scars, miombo in
# dry season), and those are exactly what this corpus does not contain. Rebuilding chips
# after the national compose finishes would supply real background chips and is the
# obvious next iteration; so would a mapped calibration quadrat.
#
# Val holdout for Zambia: the Copperbelt cluster (Kitwe / Kalulushi / Ndola, cells
# ix 0060-0063 x iy 0051-0054, set in configs/aoi.yaml), ~700 km from the Lusaka training
# cluster, so neither the +/-900 m chip jitter nor the 2.24 km window can leak a training
# positive into it. Chosen from geography before training, not from any score.

data:
  index_path: data/chips/combined_zambia/index.parquet
  batch_size: 8
  num_workers: 4

task:
  model_factory: EncoderDecoderFactory
  model_args:
    # terramind_v1_tiny fits the GTX 1060; bump to _small if a bigger GPU is used.
    backbone: terramind_v1_tiny
    backbone_pretrained: true
    backbone_modalities: [S2L2A]
    backbone_bands:
      S2L2A: [BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3,
              NIR_BROAD, NIR_NARROW, SWIR_1, SWIR_2]
    necks:
      - name: SelectIndices
        indices: [2, 5, 8, 11]
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
    decoder: UNetDecoder
    decoder_channels: [256, 128, 64, 32]
    num_classes: 2
    rescale: true
  # Recall-first: Tversky with beta>alpha penalises false negatives (missed PV) harder
  # than false positives. gamma=1 = plain Tversky (no focal term).
  loss: tversky
  tversky_args: {alpha: 0.3, beta: 0.7, gamma: 1.0}
  class_weights: [0.25, 0.75]
  ignore_index: -1
  lr: 1.0e-4
  optimizer: AdamW
  optimizer_hparams:
    weight_decay: 0.05
  freeze_backbone: false
  plot_on_val: false

trainer:
  max_epochs: 60
  accumulate_grad_batches: 2

checkpoint_dir: data/models/v7_combined_zambia
patience: 8
monitor: val/mIoU
monitor_mode: max
