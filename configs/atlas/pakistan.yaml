confidence:
  # Extra <li>s under "Outside the range". The two country-neutral bullets there (hand-picked
  # areas, mapping-imagery epoch) are written by the builder whenever an AOI has calibration
  # quadrats; these are Pakistan's own measurements and belong to Pakistan.
  caveats:
    - >-
      <b>The calibration areas had to be hand-picked, because aerial imagery in most of the
      country is too old.</b> Checking for a small installation needs imagery recent enough to
      tell "no panels" from "panels installed after this photo", and random locations have so far
      mostly landed on imagery that is too old, so the areas were placed where recent imagery
      exists. Eight randomly drawn areas that pass this check were proposed on 2026-10-28 and are
      on the map as hollow diamonds; none is mapped yet.

    - >-
      <b>The small-rooftop figure, most of Best, rests on few calibration areas where it is applied
      most.</b> roofclf is trained on 30 areas, and its scores are converted to panel area with the
      19 that pass a consistency check between flagged and mapped roofs. Below 1,717
      buildings/km&sup2;, which covers all but 20 of the 2,957 cells priced, that conversion rests
      on 9 of them, and 83% of their mapped small-rooftop panel area lies in the three Islamabad
      areas. About 13.5% of the buildings priced are in cells sparser than the sparsest of the 19
      (124 buildings/km&sup2;). Predicted from the other areas, 18 of 29 areas come out within
      about a quarter of their mapped small-rooftop panel area, but six of the ten under 1,000
      buildings/km&sup2; are more than 40% off, from 0.14 to 8 times it. The range above re-draws
      the 19 areas; it does not measure how far rural cells differ from them (measured
      2026-10-28).

    # Added 2026-10-28: the 2021-epoch test, run only on cells whose composite_1 really is
    # 2021 imagery (the 122 early city cells hold 2025 imagery there).
    - >-
      <b>The building score partly measures what kind of roof it is, not only whether it has
      panels.</b> On Sentinel-2 imagery from late 2021, before most of today's panels were
      installed, the score still picks out the roofs that carry panels today almost as well as on
      current imagery (a ranking score of 0.79&ndash;0.82 against 0.87, where 0.5 is chance), and
      its sum over all roofs is still 30&ndash;57% of today's. The segmentation model, by contrast,
      finds about 12% of today's large arrays on the same 2021 imagery, close to the share that
      registered capacity and panel imports suggest for the end of 2021 (about 14%). In the
      calibration areas, about half of the summed score sits on roofs without panels. The
      calibration turns this into panel area correctly on average for places like the calibration
      areas; where villages carry fewer or more panels than their roofs suggest, it cannot tell.
      Mapping the randomly drawn areas would measure that (measured 2026-10-28 on rural and
      peri-urban cells with 2021 imagery, 1.8 million buildings).

    # Added 2026-10-28: score signal by footprint size, quadrats and 2021 cells.
    - >-
      <b>The smallest buildings are counted mostly from their surroundings.</b> A footprint under
      50 m&sup2; covers less than half of one 10 m pixel, and the score barely tells such roofs with
      panels from those without: roofs with mapped panels average a score of 0.07&ndash;0.10,
      against 0.37 on 200&ndash;400 m&sup2; roofs, and 83&ndash;88% of these buildings' summed
      score in the calibration areas sits on roofs without panels. They hold under 5% of the mapped
      small-rooftop panel area in the calibration areas, but about 12% of this page's
      small-rooftop figure, roughly 2.8 GWp, because rural Pakistan has many small footprints
      such as sheds and outbuildings. Leaving them out, a 50 m&sup2; floor that already applies in
      the 20 densest cells, would lower Best by about that much. A blind review of 400 roofs, 121
      of them under 50 m&sup2;, has been drawn to decide (2026-10-28).

    # Added 2026-10-28 from an external review: the interval composes measured errors only,
    # and the project's own history shows method choices move Best further than it does.
    - >-
      <b>The range covers measured errors, not choices of method.</b> On 2026-10-25 roofs started
      counting in proportion to their score instead of by a yes/no cut-off, and Best as published
      moved from 24,438 MWp (90% range 20,894&ndash;33,666) to 34,589 MWp
      (29,308&ndash;41,736): each lies outside the other's range. Which segmentation model reads
      the imagery, which calibration table prices its detections, where the calibrated density
      range ends and whether the smallest buildings count are choices of the same kind, and none
      of them is part of the range above.

  # Non-satellite figures to read the headline against. Context, never a pass/fail check
  # (owner rule): registered capacity is a floor, imports a loose ceiling, and the one
  # independent estimate is itself derived from imports. A country with none omits this key.
  corroboration: >-
      <p><b>Other sources give context, not a check.</b> Pakistan publishes no count of installed
      solar. What is registered, about 6.8 GW of net-metered rooftops by September 2025 plus about
      0.8 GW of utility-scale parks, is a floor, since most systems are never registered. Solar
      panels imported from China since 2017 add up to about 51 GW by the end of 2025 (Ember customs
      data), a loose ceiling: some are still in stock or were re-exported, and earlier imports are
      missing. The only independent estimate of installed capacity, 27&ndash;33 GW in January 2026
      (Renewables First, derived from the import figures), sits just below this page's Best
      estimate and overlaps its 90% range. Agreement in order of magnitude is all these show; none
      of them can confirm a number on this page. Sources:
      <a href="https://www.pv-magazine.com/2026/01/20/pakistans-installed-pv-capacity-estimated-above-27-gw/"
      target="_blank" rel="noopener">pv magazine, 20 January 2026</a>;
      <a href="https://ember-energy.org/data/china-solar-exports-data/" target="_blank"
      rel="noopener">Ember</a>.</p>
