# Pakistan's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# This is the project's reference atlas, and everything in this file used to be hard-coded
# in `atlas.py` or in `templates/pv_evidence_atlas.html` -- which meant Germany's, France's
# and Zambia's atlases published Pakistan's NEPRA corroboration, Pakistan's density-sparsity
# caveat and a link to Pakistan's composition page as if they were their own. Moving it here
# is what makes that template reusable. Nothing below changes a number on the page; it is
# the prose and the map annotations only.

title: Pakistan

# Rendered as "Full breakdown with credible intervals: capacity composition" under the
# composition bar. Must be a page published alongside the atlas (docs/assets/interactive/).
composition_page: pakistan_atlas_composition.html

# Map annotations only. [name, lon, lat].
cities:
  - [Karachi, 67.01, 24.86]
  - [Lahore, 74.34, 31.55]
  - [Islamabad, 73.05, 33.68]
  - [Faisalabad, 73.08, 31.42]
  - [Multan, 71.52, 30.2]
  - [Peshawar, 71.58, 34.01]
  - [Quetta, 66.98, 30.18]
  - [Hyderabad, 68.37, 25.4]
  - [Rawalpindi, 73.07, 33.6]
  - [Gujranwala, 74.19, 32.16]
  - [Sukkur, 68.85, 27.7]
  - [Bahawalpur, 71.68, 29.4]

