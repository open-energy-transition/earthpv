# Texas's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Texas, a state run as an AOI of its own (`division.subtype: region`): its regions are its
# 254 counties (`density.subnational_units`), and its hand-mapped solar is clipped to the
# state's own outline. No calibration quadrats, no record-level register used, so the
# builder's default no-ground-truth text stands. The segmentation is localized on Texas's
# own OpenStreetMap labels and tied v5 on the held-out Bexar County, winning on pixel IoU
# (results/texas_checkpoint_decision.json).
#
# Numbers belong in docs/results/texas.md; nothing here quotes a figure a rebuild could
# change.

