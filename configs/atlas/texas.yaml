confidence:
  caveats:
    - >-
      <b>This page maps Texas's solar parks, not its rooftops.</b> No area of Texas has been
      mapped panel by panel, so there is nothing to calibrate a per-building rooftop
      classifier against here. Everything on the map is either hand-mapped in OpenStreetMap
      or an array the segmentation model outlined directly, which in practice means
      installations of roughly 400 m&sup2; and up, and the model finds almost no rooftop
      arrays. The household and business systems the U.S. Energy Information Administration
      (EIA) counts as small-scale are below that size and are missing from Best.
    - >-
      <b>Panel capacity, not inverter capacity.</b> This page counts panels (MWp, DC). EIA's
      figures further down count inverter capacity (AC), and Texas's parks carry roughly 29% more panel than inverter capacity where EIA
      reports both, so read Best against EIA's figures with that in mind.
    - >-
      <b>Most of this page is mapped park outlines, priced by area.</b> OpenStreetMap
      mappers have outlined most of Texas's solar parks as whole sites. A site's capacity is
      its area times a fixed density of panels per square metre of site, measured on parks
      elsewhere; in the Texas parks where EIA reports panel capacity, the mapped site holds
      close to that density, but a single park can differ from it either way.
    - >-
      <b>Some mapped parks are not yet in EIA's inventory.</b> Several large parks mapped in
      OpenStreetMap lie far from any plant EIA lists as operating in September 2026. The
      model finds panels over nearly all of them in this summer's imagery, so they are
      counted; they are probably newer than EIA's inventory, or EIA places them elsewhere.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar, and
      Texas has hundreds of them waiting, as well as large model outlines below that size.
      Few of them lie near a plant in EIA's inventory, so most are probably not solar.
      Mapping a real park brings it into the verified layer.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation. A
      park built on empty land that nobody has mapped yet falls outside both rules and is not
      on this page; a few of EIA's plants lie in such cells. Cells that were not imaged are
      hatched on the map.
    - >-
      <b>Regions are counties, and border cells are kept whole.</b> Texas is run as a state,
      so the regions on this page are its counties. A map cell that straddles the border with
      a neighbouring state or with Mexico is counted in full, so a few panels outside Texas
      are in this page's total.
    - >-
      <b>The plausibility check cannot vouch for the county figures here.</b> It compares
      each county's ground-mounted capacity with its rooftop capacity, and most counties with
      a park fail it. That is expected where rooftop systems are mostly too small for the
      model to see, since the comparison then has little to divide by. It also means the
      check says little either way about false detections on open ground.
