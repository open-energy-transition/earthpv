# Luxembourg's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Luxembourg, national. Same starting condition as Belgium and the Netherlands -- no
# calibration quadrats, no record-level register used, no third-party dataset checked
# against -- so the builder's default no-ground-truth text stands. The segmentation is
# localized on Luxembourg's own OpenStreetMap labels; it tied v5 on the held-out canton and
# ships under the tie rule (results/luxembourg_checkpoint_decision.json).
#
# Numbers belong in docs/results/luxembourg.md; nothing here quotes a figure a rebuild could
# change.

title: Luxembourg

