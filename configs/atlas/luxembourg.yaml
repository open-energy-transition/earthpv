confidence:
  caveats:
    - >-
      <b>The small-installation half of this page does not exist yet, and in Luxembourg that
      is most of the solar.</b> No area of Luxembourg has been mapped panel by panel, so
      there is nothing to calibrate a per-building rooftop classifier against here.
      Everything on the map is either hand-mapped in OpenStreetMap or an array the
      segmentation model outlined directly, which in practice means installations of roughly
      400 m&sup2; and up. The household and small-business rooftop systems that make up most
      of Luxembourg's fleet are below that size, so Best sits far below the regulator's
      figure further down this page.
    - >-
      <b>Cells on the border are kept whole, and in a country this small that matters a
      lot.</b> A map cell that straddles the border with France, Belgium or Germany is
      counted in full, and most of Luxembourg's cells touch a border. A large share of what
      the model finds lies on the far side, in France, Belgium or Germany, and is in this
      page's total; the hand-mapped installations are Luxembourg's own.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation. A
      park built on empty land that nobody has mapped yet falls outside both rules and is not
      on this page. Cells that were not imaged are hatched on the map.
    - >-
      <b>The model was checked on a thin holdout.</b> The localized model and the general one
      were compared on one held-out canton with only a few dozen mapped installations, and
      tied. The localized model ships under the project's rule that a tie goes to it, but a
      holdout that small cannot separate two models by much.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar.
      Luxembourg's have not been judged yet. Mapping such a park brings it into the verified
      layer.
    - >-
      <b>The plausibility check cannot vouch for the canton figures here.</b> It compares
      each canton's ground-mounted capacity with its rooftop capacity, and nearly every
      canton is flagged. That is expected where rooftop systems are mostly too small for the
      model to see, since the comparison then has little to divide by. It also means the
      check says little either way about false detections on open ground.
