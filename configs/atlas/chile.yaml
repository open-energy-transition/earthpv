confidence:
  caveats:
    - >-
      <b>This page maps Chile's solar parks, not its rooftops.</b> No area of Chile has been
      mapped panel by panel, so there is nothing to calibrate a per-building rooftop
      classifier against here. Everything on the map is either hand-mapped in OpenStreetMap
      or an array the segmentation model outlined directly, which in practice means
      installations of roughly 400 m&sup2; and up. The small systems on homes and businesses
      connected under net billing are below that size and almost all missing from Best.
    - >-
      <b>Most of this page is mapped park outlines, priced by area.</b> OpenStreetMap
      mappers have outlined most of Chile's solar parks as whole sites. A site's capacity is
      its area times a fixed density of panels per square metre of site, measured on parks
      elsewhere, so a single park can read high or low.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar. Chile
      has a couple of hundred of them waiting, most of their area in the northern desert,
      where salt flats and evaporation ponds can look like rows of panels from orbit. None
      has been checked yet, so real parks among them are missing from Best, and many of the
      outlines on the map there may not be solar.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation. A
      park built on empty land that nobody has mapped yet falls outside both rules and is not
      on this page. Cells that were not imaged are hatched on the map.
    - >-
      <b>The plausibility check cannot vouch for the regional figures here.</b> It compares
      each region's ground-mounted capacity with its rooftop capacity, and most regions with
      a park fail it. That is expected where rooftop systems are mostly too small for the
      model to see, since the comparison then has little to divide by. It also means the
      check says little either way about false detections on open ground.
