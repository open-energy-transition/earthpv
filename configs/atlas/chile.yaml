# Chile's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Chile, national: the mainland, the Juan Fernandez islands and Rapa Nui (Easter Island).
# Same starting condition as Mexico -- no calibration quadrats, no record-level register
# used -- so the builder's default no-ground-truth text stands. The segmentation is localized
# on Chile's own OpenStreetMap labels and ships only if it beats the general model on a held-out region
# (results/chile_checkpoint_decision.json records which one did).
#
# Published 2026-11-22 as a first iteration: the blob and large-installation reviews are
# still open. Numbers belong in docs/results/chile.md; nothing here quotes a figure a
# rebuild could change.

title: Chile

# The map opens on the mainland, as Portugal's and Spain's do: framing Rapa Nui, 3,500 km
# offshore, too would leave the mainland a thin strip at one edge. The islands stay on the
# map and in every total, a pan away. Check against the page's own cells before publishing.
