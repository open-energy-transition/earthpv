confidence:
  caveats:
    - >-
      <b>This page misses most of Australia's solar.</b> Most of Australia's solar capacity
      sits on the roofs of homes and businesses, in systems far smaller than the roughly
      400 m&sup2; the model can see. Everything on the map is either hand-mapped in
      OpenStreetMap or an array the segmentation model outlined directly, so Best counts the
      parks and the largest roofs. The small rooftop arrays mappers have drawn in
      OpenStreetMap do count, but they are a small share of the whole, and no area has been
      mapped panel by panel to calibrate a rooftop classifier against.
    - >-
      <b>This page runs on the general model.</b> A model trained on Australia's own
      OpenStreetMap labels found far fewer of the held-out installations in New South Wales
      than the general model did, so the general model draws the outlines here.
    - >-
      <b>Most of the parks are mapped outlines, priced by area.</b> OpenStreetMap mappers
      have outlined most of Australia's solar farms as whole sites. A site's capacity is its
      area times a fixed density of panels per square metre of site, measured on parks
      elsewhere, so a single farm can read high or low.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar, and
      Australia has dozens of them waiting, as well as hundreds of large model outlines below
      that size. None has been checked yet.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation. A
      farm built on empty land that nobody has mapped yet falls outside both rules and is not
      on this page. Cells that were not imaged are hatched on the map.
    - >-
      <b>The plausibility check cannot vouch for the state figures here.</b> It compares
      each state's ground-mounted capacity with its rooftop capacity, and most states fail
      it. That is expected where rooftop systems are mostly too small for the model to see,
      since the comparison then has little to divide by. It also means the check says little
      either way about false detections on open ground.
