# Australia's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Australia, national: the six states, the Northern Territory and the Australian Capital
# Territory, with Tasmania, the Torres Strait islands and Lord Howe Island; the external
# territories (Norfolk, Christmas and Cocos Islands) and Macquarie Island are left out.
# Same starting condition as Chile -- no calibration quadrats, no record-level register
# used -- so the builder's default no-ground-truth text stands. The segmentation is localized
# on Australia's own OpenStreetMap labels and ships only if it beats the general model on a
# held-out region; it lost on New South Wales, so the general model (v28) ships
# (results/australia_checkpoint_decision.json).
#
# Published 2026-11-22 as a first iteration: the blob and large-installation reviews are
# still open. Numbers belong in docs/results/australia.md; nothing here quotes a figure a
# rebuild could change.

