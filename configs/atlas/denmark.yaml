confidence:
  caveats:
    - >-
      <b>This page maps Denmark's solar parks, not its rooftops.</b> No area of Denmark has
      been mapped panel by panel, so there is nothing to calibrate a per-building rooftop
      classifier against here. Everything on the map is either hand-mapped in OpenStreetMap
      or an array the segmentation model outlined directly, which in practice means
      installations of roughly 400 m&sup2; and up, and the model finds almost no rooftop
      arrays. The household and business rooftop systems that make up most of Denmark's
      installations are below that size, so Best sits well below the energy agency's figure
      further down this page.
    - >-
      <b>Solar heating fields look like solar parks from orbit.</b> Denmark has many large
      fields of solar thermal collectors feeding district heating. Where one is mapped in
      OpenStreetMap as a heating plant, the model's outline over it is dropped; an unmapped
      one would be counted here as photovoltaics. One plant whose name says it heats water
      carries an electricity tag in OpenStreetMap and is counted as a small solar thermal
      power plant; it is probably mis-tagged.
    - >-
      <b>Building footprints are stitched from two sources.</b> The open footprint dataset
      used elsewhere (VIDA) has gaps in Denmark. Those gaps were filled with OpenStreetMap
      buildings, so rooftop and ground placement and the choice of which cells to image rest
      partly on a second source.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation. A
      park built on empty land that nobody has mapped yet falls outside both rules and is not
      on this page. Cells that were not imaged are hatched on the map.
    - >-
      <b>The model was checked on a small holdout.</b> The localized model and the general
      one were compared on one held-out region with about a hundred mapped installations of
      500 m&sup2; and up. The localized model found more of them, but a holdout that size
      cannot separate two models by much.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar.
      Denmark's few have not been judged yet, nor have its large model outlines below that
      size. Mapping such a park brings it into the verified layer.
    - >-
      <b>Cells on the border are kept whole.</b> A map cell that straddles the border with
      Germany, or the strait to Sweden, is counted in full, so a few panels outside Denmark
      are in this page's total.
    - >-
      <b>The plausibility check cannot vouch for the regional figures here.</b> It compares
      each region's ground-mounted capacity with its rooftop capacity, and nearly every
      region fails it. That is expected where rooftop systems are mostly too small for the
      model to see, since the comparison then has little to divide by. It also means the
      check says little either way about false detections on open ground.
