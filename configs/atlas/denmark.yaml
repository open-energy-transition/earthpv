# Denmark's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Denmark, national. Same starting condition as Belgium, the Netherlands and Luxembourg -- no
# calibration quadrats, no record-level register used, no third-party dataset checked
# against -- so the builder's default no-ground-truth text stands. The segmentation is
# localized on Denmark's own OpenStreetMap labels and beat v5 on the held-out Nordjylland
# (results/denmark_checkpoint_decision.json).
#
# Numbers belong in docs/results/denmark.md; nothing here quotes a figure a rebuild could
# change.

