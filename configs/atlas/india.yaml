# India's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# India, national. Same starting condition as Zambia and Nigeria -- no calibration
# quadrats, no register used, no third-party dataset checked against -- so the builder's
# default no-ground-truth text stands. A segmentation fine-tuned on India's own
# OpenStreetMap labels (v10_combined_india, the owner's 2026-09-23 instruction) was trained
# and LOST on the held-out Gujarat box, so this page runs on v5_combined_france, whose only
# Indian training data is Gujarat's (results/india_checkpoint_decision.json). Gujarat's
# older state-level page (docs/results/gujarat.md) is superseded by this one.
#
# Numbers belong in docs/results/india.md; nothing here quotes a figure that a rebuild
# could change.

title: India

# Gurgaon: the first start-here box (calib-candidates --priority), mapped and declared
# Rule-1 complete by the owner 2026-10-25 against Esri imagery of 2025-05-27. Registered, not
# fitted: one area cannot calibrate a roofclf half, hence `used: false` (drawn on the map;
# the confidence text does not claim it as ground truth). Purba Champaran: a sampled farm
# box (calib-candidates --farmland), swept by the owner 2026-10-25 on Esri imagery of
# 2025-04-03 and confirmed empty; no farm detector has been run on India.
calibration_boxes:
  - {name: "Gurgaon, Haryana", stem: gurgaon_priority_calib_1km, status: rule1, used: false}
  - {name: "Purba Champaran, Bihar (farm, no PV)", stem: purba_champaran_f3_farm_calib_3km, status: rule1, used: false}

# Bronze, pinned 2026-10-28 when the ring rebuild came out Silver: derive_validation_score
# gives Silver to any AOI with a registered area in data/labels/<aoi>/, and both areas above
# are `used: false`, so nothing on this page is fitted on local ground truth.
validation:
  score: bronze

cities:
  - [Delhi, 77.209, 28.614]
  - [Mumbai, 72.878, 19.076]
  - [Bengaluru, 77.595, 12.972]
  - [Kolkata, 88.364, 22.573]
  - [Chennai, 80.271, 13.083]
  - [Hyderabad, 78.487, 17.385]
  - [Ahmedabad, 72.571, 23.023]
  - [Jaipur, 75.787, 26.912]
  - [Jodhpur, 73.024, 26.238]
  - [Lucknow, 80.947, 26.847]
  - [Nagpur, 79.088, 21.146]
  - [Guwahati, 91.736, 26.145]

confidence:
  caveats:
    - >-
      <b>The small-installation half of this page does not exist yet.</b> One area of
      India, in Gurgaon, has been mapped panel by panel, and one area is not enough to
      calibrate the per-building classifier that supplies most of Pakistan's estimate. Everything on the map
      is either hand-mapped in OpenStreetMap or an array the segmentation model outlined
      directly, which in practice means installations of roughly 400 m&sup2; and up. The
      household rooftop systems that dominate India's recent rooftop programme are mostly
      below that size.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation.
      A utility-scale park built on empty land that nobody has mapped yet falls outside
      both rules and is not on this page.
