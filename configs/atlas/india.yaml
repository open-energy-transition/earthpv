# India's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# India, national. Same starting condition as Zambia and Nigeria -- no calibration
# quadrats, no register used, no third-party dataset checked against -- so the builder's
# default no-ground-truth text stands. A segmentation fine-tuned on India's own
# OpenStreetMap labels (v10_combined_india, the owner's 2026-09-23 instruction) was trained
# and LOST on the held-out Gujarat box, so this page runs on v5_combined_france, whose only
# Indian training data is Gujarat's (results/india_checkpoint_decision.json). Gujarat's
# older state-level page (docs/results/gujarat.md) is superseded by this one.
#
# Numbers belong in docs/results/india.md; nothing here quotes a figure that a rebuild
# could change.

title: India

# Gurgaon: the first start-here box (calib-candidates --priority), mapped and declared
# Rule-1 complete by the owner 2026-10-25 against Esri imagery of 2025-05-27. Registered, not
# fitted: one area cannot calibrate a roofclf half, hence `used: false` (drawn on the map;
# the confidence text does not claim it as ground truth). Purba Champaran: a sampled farm
# box (calib-candidates --farmland), swept by the owner 2026-10-25 on Esri imagery of
# 2025-04-03 and confirmed empty; no farm detector has been run on India.
calibration_boxes:
  - {name: "Gurgaon, Haryana", stem: gurgaon_priority_calib_1km, status: rule1, used: false}
  - {name: "Purba Champaran, Bihar (farm, no PV)", stem: purba_champaran_f3_farm_calib_3km, status: rule1, used: false}

# Bronze, pinned 2026-10-28 when the ring rebuild came out Silver: derive_validation_score
# gives Silver to any AOI with a registered area in data/labels/<aoi>/, and both areas above
# are `used: false`, so nothing on this page is fitted on local ground truth.
validation:
  score: bronze

cities:
  - [Delhi, 77.209, 28.614]
  - [Mumbai, 72.878, 19.076]
  - [Bengaluru, 77.595, 12.972]
  - [Kolkata, 88.364, 22.573]
  - [Chennai, 80.271, 13.083]
  - [Hyderabad, 78.487, 17.385]
  - [Ahmedabad, 72.571, 23.023]
  - [Jaipur, 75.787, 26.912]
  - [Jodhpur, 73.024, 26.238]
  - [Lucknow, 80.947, 26.847]
  - [Nagpur, 79.088, 21.146]
  - [Guwahati, 91.736, 26.145]

confidence:
  # The MNRE register as republished by MoSPI (scripts/validate_india_mnre.py, figures from
  # results/india_mnre_validation/summary.json, 2026-10-29). The ratios are this build's:
  # re-run `validate_india_mnre.py compare` after any rebuild and check the sentence still holds.
  corroboration: >-
    <p><b>Against India's register, ground-mounted solar is close and sits in the right
    states.</b> MNRE's state-wise register, republished by MoSPI's eSankhyiki, records 110.6
    GW of utility-scale solar on the ground (ground-mounted plants plus the solar part of
    hybrid plants) at the centre of the imagery window, January 2026. This page's best
    estimate of ground-mounted solar is about nine tenths of that, and across the 19 states
    with at least 100 MW registered it ranks them almost exactly as the register does (rank
    correlation 0.95). The register mostly quotes AC capacity and this page DC, so the real
    shortfall is nearer a fifth. Rooftop is the large gap: the register holds 24.3 GW, most
    of it household systems of a few kW, and this page sees less than a tenth of it.</p>
  caveats:
    - >-
      <b>The small-installation half of this page does not exist yet.</b> One area of
      India, in Gurgaon, has been mapped panel by panel, and one area is not enough to
      calibrate the per-building classifier that supplies most of Pakistan's estimate. Everything on the map
      is either hand-mapped in OpenStreetMap or an array the segmentation model outlined
      directly, which in practice means installations of roughly 400 m&sup2; and up. The
      household rooftop systems that dominate India's recent rooftop programme are mostly
      below that size.
    - >-
      <b>Imagery covers where people live, every mapped solar site, and the land around
      them.</b> Map cells were imaged if they hold at least 1,000 buildings or any
      hand-mapped solar installation, or lie within three cells (about 33 km) of one. A park
      built on empty land farther out than that is not on this page; hatched cells were
      never imaged.
    - >-
      <b>Solar parks the model found that nobody has mapped are counted, at a reviewed
      share.</b> A model outline larger than 10 hectares used to be left out of the
      estimate, because in other countries such outlines were mostly bright bare ground or
      rock merged into one shape. In India they are mostly parks OpenStreetMap does not hold
      yet. Outlines were checked by hand on satellite imagery: every one of the 30 largest
      was a park, and so were 51 of 60 drawn at random, larger ones more often, from the
      rest. The largest count in full and the rest at that share. They are left out in the
      six Himalayan states and territories, where both outlines drawn were shaded mountain
      slopes. None of these parks is in the hand-mapped figure.
    - >-
      <b>A mapped outline drawn around a whole planned zone counts only where panels are
      seen.</b> Seven ground outlines larger than 5 km&sup2;, among them two at Khavda in
      Gujarat, are mostly still empty land or were not fully imaged. Each counts at the share
      of it the model detects as panels, plus any plant mapped inside it, in both the
      hand-mapped and the best figure. Rewa Ultra Mega Solar is missing: its cells were never
      imaged properly.
