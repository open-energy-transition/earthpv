# India's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# India, national. Same starting condition as Zambia and Nigeria -- no calibration
# quadrats, no register used, no third-party dataset checked against -- so the builder's
# default no-ground-truth text stands. The segmentation was fine-tuned on India's own
# OpenStreetMap labels (the owner's 2026-09-23 instruction). Gujarat's older state-level
# page (docs/results/gujarat.md) is superseded by this one.
#
# Numbers belong in docs/results/india.md; nothing here quotes a figure that a rebuild
# could change.

