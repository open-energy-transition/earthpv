# South Africa's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# South Africa, national (Prince Edward Islands excluded). Same starting condition as Zambia, Nigeria, Vietnam and India -- no
# calibration quadrats, no register used, no third-party dataset checked against -- so the
# builder's default no-ground-truth text stands. The segmentation is localized on
# South Africa's own OpenStreetMap labels and ships only if it beats v5 on a held-out region
# (results/south_africa_checkpoint_decision.json records which one did).
#
# Numbers belong in docs/results/south-africa.md; nothing here quotes a figure a
# rebuild could change.

