# The Netherlands' evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# The Netherlands, European part. Same starting condition as Belgium -- no calibration
# quadrats, no record-level register used, no third-party dataset checked against -- so the
# builder's default no-ground-truth text stands. The segmentation was localized on the
# country's own OpenStreetMap labels, but the localized model (v32) lost to v5 on the held-out
# province, so the page runs v5 at the threshold that matches the two on precision
# (results/netherlands_checkpoint_decision.json).
#
# Numbers belong in docs/results/netherlands.md; nothing here quotes a figure a rebuild could
# change.

