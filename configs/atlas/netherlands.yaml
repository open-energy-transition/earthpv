confidence:
  caveats:
    - >-
      <b>The small-installation half of this page does not exist yet, and in the Netherlands
      that is most of the solar.</b> No area of the Netherlands has been mapped panel by
      panel, so there is nothing to calibrate a per-building rooftop classifier against
      here. Everything on the map is either hand-mapped in OpenStreetMap or an array the
      segmentation model outlined directly, which in practice means installations of
      roughly 400 m&sup2; and up. The household and small-business rooftop systems that make
      up much of the Dutch fleet are below that size, so Best sits far below the statistics
      office's figure further down this page.
    - >-
      <b>The detector here is the general model, run strictly.</b> A model trained on the
      Netherlands' own mapping found fewer of the installations in a held-out province than
      the general model did, so this page uses the general one, at a setting that keeps only
      near-certain pixels. That trades missed arrays for fewer false alarms, and the missed
      arrays are not added back by any correction.
    - >-
      <b>Building footprints are stitched from two sources.</b> The open footprint dataset
      used elsewhere (VIDA) has large gaps in the Netherlands. Those gaps were filled with
      OpenStreetMap buildings, which are close to complete here, so rooftop and ground
      placement and the choice of which cells to image rest partly on a second source.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation. A
      park built on empty land that nobody has mapped yet falls outside both rules and is not
      on this page. Cells that were not imaged are hatched on the map.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar. The
      Netherlands' few have not been judged yet. Mapping such a park brings it into the
      verified layer.
    - >-
      <b>Cells on the border are kept whole.</b> A map cell that straddles the border with
      Belgium or Germany is counted in full, so panels just across the border are in this
      page's total.
    - >-
      <b>The plausibility check cannot vouch for the provincial figures here.</b> It compares
      each province's ground-mounted capacity with its rooftop capacity, and nearly every
      province fails it. That is expected where rooftop systems are mostly too small for the
      model to see, since the comparison then has little to divide by. It also means the
      check says little either way about false detections on open ground.
