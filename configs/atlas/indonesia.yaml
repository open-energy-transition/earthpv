# Indonesia's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Indonesia, national: the 34 provinces of geoBoundaries IDN ADM1, which predate the 2022 split
# of Papua into six (its ADM2 regencies are current enough to place everything). Same starting
# condition as Chile and Australia -- no calibration quadrats, no record-level register used --
# so the builder's default no-ground-truth text stands. The segmentation is v61r (2026-11-26):
# the general v28 fine-tuned on Indonesia's own OpenStreetMap labels, including the
# installations the owner mapped from the first leads, and on hard negatives from oil palm
# estates and mines, at 0.95 (results/indonesia_checkpoint_decision.json; docs/experiments.md,
# "Indonesia's false leads"). The first atlas (2026-11-25) ran v28 itself at 0.98, after the
# localized v48r lost on East Java.
#
# Published 2026-11-25 as a first iteration and rebuilt on v61r 2026-11-27: the blob and
# large-installation reviews are still open. Numbers belong in docs/results/indonesia.md; nothing here quotes a figure a
# rebuild could change (Cirata's rating is the plant's, not the page's). The map frames the
# whole archipelago (no map_view): Sabang to Merauke is 46 degrees of longitude, and every
# province is populated.

