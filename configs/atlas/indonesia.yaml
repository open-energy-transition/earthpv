confidence:
  caveats:
    - >-
      <b>This page misses most of Indonesia's rooftop solar.</b> Most rooftop systems on
      homes, shops and offices are far smaller than the roughly 400 m&sup2; the model can
      see. Everything on the map is either hand-mapped in OpenStreetMap or an array the
      segmentation model outlined directly. The thousands of small rooftop arrays mappers
      have drawn in OpenStreetMap do count, but no area has been mapped panel by panel to
      calibrate a rooftop classifier against, so the rest below 400 m&sup2; is not measured.
    - >-
      <b>This page runs on a model fine-tuned for Indonesia.</b> The general model was
      retrained on Indonesia's own OpenStreetMap labels, including installations mapped from
      the first atlas's leads, and shown the oil palm estates and mines it had mistaken for
      solar. Over whole held-out areas it flags far less ground that is not solar and finds
      more of East Java's mapped installations than the general model.
    - >-
      <b>Most of Best is hand-mapped, and parks are priced by area.</b> OpenStreetMap mappers
      have outlined most of Indonesia's solar parks as whole sites. A site's capacity is its
      area times a fixed density of panels per square metre of site, measured on parks on
      land elsewhere, so a single park can read high or low. Floating plants read low: the
      outline of Cirata, the floating plant on a reservoir in West Java, prices at about
      half of its rated 192 MWp.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar.
      Indonesia has about twenty of them waiting, scattered across the islands with the most
      area in Riau, and a few hundred large model outlines below that size. None has been
      checked yet, so real parks among them are missing from Best, and some of the outlines
      on the map may not be solar.
    - >-
      <b>Clouds thin the imagery near the equator.</b> The images were taken in the dry
      season of Java, Bali, Nusa Tenggara and Sulawesi, but central and northern Sumatra and
      the Riau Islands stay cloudy all year: around Medan, Pekanbaru and Batam only a handful
      of clear days went into each picture, so arrays there are more easily missed.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation. A
      park built in a forest or on a plantation that nobody has mapped yet falls outside
      both rules and is not on this page. Cells that were not imaged are hatched on the map.
    - >-
      <b>The plausibility check flags provinces, most of them in Sumatra and Kalimantan.</b>
      It compares each province's ground-mounted capacity with its rooftop capacity. In
      several of them the model's ground-mounted outlines add up to several times its rooftop
      figure, though none adds much to the national total. Open-pit mines and cleared land
      can look like panels from orbit, and none of these outlines has been checked by a
      person yet.
