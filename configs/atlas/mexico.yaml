# Mexico's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Mexico, national: the mainland, Baja California and the islands inside the AOI's bbox. No
# calibration quadrats, no record-level register used, so the builder's default
# no-ground-truth text stands. The segmentation is localized on Mexico's own OpenStreetMap
# labels and ships only if it beats the general model on a held-out region
# (results/mexico_checkpoint_decision.json records which one did).
#
# Published 2026-11-22 as a first iteration: the blob and large-installation reviews are
# still open. Numbers belong in docs/results/mexico.md; nothing here quotes a figure a
# rebuild could change.

