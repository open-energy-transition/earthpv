confidence:
  caveats:
    - >-
      <b>The small-installation half of this page does not exist yet.</b> No area of
      Turkey has been mapped panel by panel, so there is nothing to calibrate a
      per-building rooftop classifier against here. Everything on the map is either
      hand-mapped in OpenStreetMap or an array the segmentation model outlined directly,
      which in practice means installations of roughly 400 m&sup2; and up. Household and
      small-business rooftop systems are mostly below that size.
    - >-
      <b>Solar water heaters are not solar panels.</b> The rooftop solar water heaters on
      many Turkish homes are tagged in OpenStreetMap much like photovoltaic panels. Those
      tagged as thermal were removed before training and counting; each one is far below
      the size the model can see.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation.
      A solar park built on empty land that nobody has mapped yet falls outside both rules
      and is not on this page.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar, which
      removes large false detections and, with them, any real park nobody has looked at
      yet. Mapping such a park brings it into the verified layer.
    - >-
      <b>On open ground the model adds little that is solar.</b> What the model adds
      beyond the map on factory roofs is often real: industrial estates in Manisa, Bursa
      and Ankara carry roof-wide arrays nobody has mapped. On open ground, and above all in
      the east, its largest unmapped outlines were lava fields, rocky hills, shaded
      mountain slopes and dark ploughed fields when checked on satellite imagery. Part of
      the satellite-detected ground-mounted capacity there is therefore not real. The
      Verified figure, which counts only mapped installations, is not affected.
