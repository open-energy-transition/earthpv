# Turkey's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Turkey, national. Same starting condition as Poland, Namibia and the 2026-10-10 queue --
# no calibration quadrats, no register used, no third-party dataset checked against -- so
# the builder's default no-ground-truth text stands. The segmentation is localized on
# Turkey's own OpenStreetMap labels and ships only if it beats v5 on a held-out region
# (results/turkiye_checkpoint_decision.json records which one did).
#
# Numbers belong in docs/results/turkiye.md; nothing here quotes a figure a rebuild could
# change.

