# Portugal's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Portugal, national: the mainland, the Azores and Madeira. Same starting condition as Belgium
# and Spain -- no calibration quadrats, no record-level register used, no third-party dataset
# checked against -- so the builder's default no-ground-truth text stands. The segmentation is
# localized on Portugal's own OpenStreetMap labels and ships only if it beats v5 on a held-out
# region (results/portugal_checkpoint_decision.json records which one did).
#
# Region names are geoBoundaries' (districts in capitals, the two autonomous regions spelled
# out); six of them reach the page only through density._repair_mojibake.
#
# Numbers belong in docs/results/portugal.md; nothing here quotes a figure a rebuild could
# change.

title: Portugal

# The map opens on the mainland (owner, 2026-11-10): framing the Azores and Madeira too left it a
# small corner of the Atlantic. The islands stay on the map and in every total, a pan away.
# Extent of the page's own cells east of 10 W.
