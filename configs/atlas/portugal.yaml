confidence:
  caveats:
    - >-
      <b>The small-installation half of this page does not exist yet.</b> No area of
      Portugal has been mapped panel by panel, so there is nothing to calibrate a
      per-building rooftop classifier against here. Everything on the map is either
      hand-mapped in OpenStreetMap or an array the segmentation model outlined directly,
      which in practice means installations of roughly 400 m&sup2; and up. Most
      self-consumption systems on homes and businesses are below that size, so they are
      largely missing from Best.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation. A
      park built on empty land that nobody has mapped yet falls outside both rules and is not
      on this page. Cells that were not imaged are hatched on the map.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar, which
      removes large false detections and, with them, any real park nobody has looked at
      yet. Portugal's have not been judged yet. Mapping such a park brings it into the
      verified layer.
    - >-
      <b>Cells on the border are kept whole.</b> A map cell that straddles the border with
      Spain is counted in full, so panels just across the border are in this page's total.
    - >-
      <b>The plausibility check cannot vouch for the district figures here.</b> It compares
      each district's ground-mounted capacity with its rooftop capacity, and most districts
      fail it. That is expected where rooftop systems are mostly too small for the model to
      see, since the comparison then has almost nothing to divide by. It also means the check
      says little either way about false detections on open ground, which nobody has yet
      looked at on imagery in Portugal.
