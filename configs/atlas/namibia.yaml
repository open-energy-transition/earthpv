confidence:
  caveats:
    - >-
      <b>The small-installation half of this page does not exist yet.</b> No area of
      Namibia has been mapped panel by panel, so there is nothing to calibrate a
      per-building rooftop classifier against here. Everything on the map is either
      hand-mapped in OpenStreetMap or an array the segmentation model outlined directly,
      which in practice means installations of roughly 400 m&sup2; and up. Household,
      farm and small-business systems are mostly below that size.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation.
      Across most of Namibia a 0.1-degree cell holds far fewer buildings than that, so
      farms, lodges and villages outside the towns are not imaged, and a solar park built
      on empty land that nobody has mapped yet is not on this page.
    - >-
      <b>Solar parks the model outlines but nobody has mapped are not counted.</b> A model
      outline above 100,000 m&sup2; only counts when it carries a mapped plant geometry. That
      rule removes the salt pans, dark rock and mine workings of that size the model can
      mistake for panels, and with them the occasional real park that is not yet in
      OpenStreetMap. Mapping such a park brings it into the verified layer.
    - >-
      <b>Seasonal pans in the north are counted as solar parks.</b> In the Cuvelai basin
      (Omusati, Ohangwena, Oshana and Oshikoto) the model reads the flat, bright floors and
      standing water of oshanas as ground-mounted panels. Satellite imagery of the largest
      such detections shows pans, not panels, so most of the satellite-detected capacity in
      those four regions is not real. No filter removes them yet; the Verified figure, which
      counts only mapped installations, is not affected.
