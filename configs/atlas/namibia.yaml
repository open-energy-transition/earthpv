# Namibia's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Namibia, national. Same starting condition as Zambia, Nigeria, Vietnam, India and the
# 2026-10-10 queue -- no calibration quadrats, no register used, no third-party dataset
# checked against -- so the builder's default no-ground-truth text stands. The segmentation
# is localized on Namibia's own OpenStreetMap labels and ships only if it beats v5 on a
# held-out region (results/namibia_checkpoint_decision.json records which one did).
#
# Numbers belong in docs/results/namibia.md; nothing here quotes a figure a rebuild could
# change.

title: Namibia

cities:
