# California's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# California, a state run as an AOI of its own (`division.subtype: region`), like Texas: its
# regions are its counties (`density.subnational_units`), and its hand-mapped solar is
# clipped to the state's own outline (Nevada's parks around Las Vegas lie inside the bbox).
# No calibration quadrats, no record-level register used, so the builder's default
# no-ground-truth text stands. The segmentation is localized on California's own
# OpenStreetMap labels and beat v5 on the held-out Santa Clara County
# (results/california_checkpoint_decision.json).
#
# Numbers belong in docs/results/california.md; nothing here quotes a figure a rebuild could
# change.

