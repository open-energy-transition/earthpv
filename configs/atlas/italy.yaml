confidence:
  caveats:
    - >-
      <b>This page maps Italy's ground-mounted solar, not its rooftops.</b> No area of Italy
      has been mapped panel by panel, so there is nothing to calibrate a per-building rooftop
      classifier against here. Everything on the map is either hand-mapped in OpenStreetMap
      or an array the segmentation model outlined directly, which in practice means
      installations of roughly 400 m&sup2; and up, and the model finds almost no rooftop
      arrays. About two thirds of Italy's capacity is on buildings, most of it household and
      small-business systems below that size, so Best sits far below the official total
      further down this page and close to its ground-mounted part. The north, where rooftops
      dominate, looks emptier here than it is.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation. A
      park built on empty land that nobody has mapped yet falls outside both rules and is not
      on this page. Cells that were not imaged are hatched on the map.
    - >-
      <b>Building footprints are stitched from two sources.</b> The open footprint dataset
      used elsewhere (VIDA) has gaps in Italy. Those gaps were filled with OpenStreetMap
      buildings, so rooftop and ground placement and the choice of which cells to image rest
      partly on a second source.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar. Italy's
      several hundred have not been judged yet, nor have its large model outlines below that
      size. Mapping such a park brings it into the verified layer.
    - >-
      <b>What the model adds on open ground has not been checked by eye.</b> No sample of the
      model's unmapped ground outlines has been looked at on high-resolution imagery in Italy,
      so how many of them are panels and how many are greenhouses, plastic-covered fields,
      quarries or bright bare ground is not known. They are priced by how often outlines of
      their size matched mapped solar.
    - >-
      <b>Cells on the border are kept whole.</b> A map cell that straddles the border with
      France, Switzerland, Austria or Slovenia, or that holds San Marino or Vatican City, is
      counted in full, so a few panels outside Italy are in this page's total.
    - >-
      <b>The plausibility check cannot vouch for the regional figures here.</b> It compares
      each region's ground-mounted capacity with its rooftop capacity, and every region fails
      it. That is expected where rooftop systems are mostly too small for the model to see,
      since the comparison then has little to divide by. It also means the check says little
      either way about false detections on open ground.
