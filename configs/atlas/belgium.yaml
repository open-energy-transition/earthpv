# Belgium's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Belgium, national. Same starting condition as Poland and Spain -- no calibration quadrats,
# no record-level register used, no third-party dataset checked against -- so the builder's
# default no-ground-truth text stands. The segmentation is localized on Belgium's own
# OpenStreetMap labels and ships only if it beats v5 on a held-out region
# (results/belgium_checkpoint_decision.json records which one did).
#
# Numbers belong in docs/results/belgium.md; nothing here quotes a figure a rebuild could
# change.

title: Belgium

cities:
  - [Brussels, 4.352, 50.847]
  - [Antwerp, 4.402, 51.221]
  - [Ghent, 3.721, 51.055]
  - [Bruges, 3.225, 51.209]
  - [Leuven, 4.701, 50.880]
