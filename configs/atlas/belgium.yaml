confidence:
  caveats:
    - >-
      <b>The small-installation half of this page does not exist yet, and in Belgium that
      is most of the solar.</b> No area of Belgium has been mapped panel by panel, so there
      is nothing to calibrate a per-building rooftop classifier against here. Everything on
      the map is either hand-mapped in OpenStreetMap or an array the segmentation model
      outlined directly, which in practice means installations of roughly 400 m&sup2; and
      up. The household and small-business rooftop systems that make up much of Belgium's
      fleet are mostly below that size, so Best sits far below the grid operator's figure
      further down this page.
    - >-
      <b>Imagery covers where people live, plus every mapped solar site.</b> Map cells were
      imaged if they hold at least 1,000 buildings or any hand-mapped solar installation.
      A park built on empty land that nobody has mapped yet falls outside both rules and is
      not on this page.
    - >-
      <b>Cells on the border are kept whole.</b> A map cell that straddles the national
      border is counted in full, so panels just across the border are in this page's total.
      With a long border and a small total, that matters more here than on most pages.
    - >-
      <b>Very large model outlines count only once checked.</b> A model outline above
      100,000 m&sup2; counts only when it is mapped or a person has judged it solar, which
      removes large false detections and, with them, any real park nobody has looked at
      yet. Belgium's have not been judged yet. Mapping such a park brings it into the
      verified layer.
    - >-
      <b>The plausibility check cannot vouch for the regional figures here.</b> It compares
      each region's ground-mounted capacity with its rooftop capacity; Wallonia fails it
      and Flanders is flagged. That is expected where rooftop systems are mostly too small
      for the model to see, since the comparison then has little to divide by. It also
      means the check says little either way about false detections on open ground.
