# Spain's evidence atlas content (src/earthpv/atlas_config.py for the schema).
#
# Spain, national: the peninsula, the Balearic and Canary Islands, Ceuta and Melilla. Same
# starting condition as Poland and Türkiye -- no calibration quadrats, no record-level
# register (PRETOR publishes none, docs/data-registry.md), no third-party dataset checked
# against -- so the builder's default no-ground-truth text stands. The segmentation is
# localized on Spain's own OpenStreetMap labels and ships only if it beats v5 on a held-out
# region (results/spain_checkpoint_decision.json records which one did).
#
# Numbers belong in docs/results/spain.md; nothing here quotes a figure a rebuild could
# change.
#
# Checked 2026-11-08 (scripts/spain_greenhouse_check.py, docs/results/spain.md): Almería's and
# Murcia's plastic greenhouses do not read as PV, so the page carries no caveat about them.

title: Spain

# The mapper's first box (owner, 2026-11-08): Vigo's car-plant roofs rather than the rule's
# pick, a dense Palma neighbourhood whose blocks are traced as single large buildings.
start_here: pontevedra_priority_calib_1km

# The map opens on the peninsula, the Balearics, Ceuta and Melilla (owner, 2026-11-10): framing
# the Canaries too left the mainland a small corner of an ocean. The islands stay on the map
# and in every total, a pan away. Extent of the page's own cells east of 12 W.
map_view: [-9.3, 35.1, 4.4, 43.8]

cities:
  - [Madrid, -3.704, 40.417]
  - [Barcelona, 2.173, 41.385]
  - [Valencia, -0.376, 39.470]
  - [Seville, -5.984, 37.389]
