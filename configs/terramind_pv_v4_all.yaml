# TerraTorch fine-tuning config for PV segmentation -- Germany + Pakistan + India combined.
#
# Same recipe as configs/terramind_pv_v3india.yaml (the current production config: same
# backbone, necks, decoder, loss, lr, schedule, monitor metric), the only variable is the
# corpus. v3india's own index_path (data/chips/combined/index.parquet) is actually just
# germany + punjab -- despite the "india" in its name, India was never in its training
# data (configs/aoi.yaml's gujarat block said so explicitly: "no India-specific
# retraining yet"). This config is the first to actually include it.
#
# Corpus (data/chips/combined_all/index.parquet, 6,661 chips, scripts/merge_chip_index.py
# germany punjab pakistan gujarat):
#   germany : 3,189 chips (141 val, 2,173 with PV)     -- unchanged
#   punjab  : 274 chips (37 val, 218 with PV)          -- unchanged, kept alongside...
#   pakistan: 2,438 chips (48 val, 1,593 with PV)      -- ...the broader country-wide
#             Pakistan build (built 2026-07-18, zero chip_id overlap with punjab's
#             2026-07-05 build -- two independently-sampled sets over overlapping
#             imagery, not one subsuming the other), so both are included for maximum
#             Pakistani coverage rather than picking one.
#   gujarat : 760 chips (128 val, 381 with PV)         -- NEW. Built 2026-07-12, never
#             previously trained on. A geographic val holdout (Surat-Bharuch-Vadodara
#             corridor, lon 72.7-73.9E / lat 21.0-23.0N) was carved into its index just
#             for this run so India detection can actually be measured, not just
#             Germany/Pakistan val health -- see configs/aoi.yaml's gujarat block.
#
# checkpoint_dir below is fresh (v3_combined_india's own directory no longer exists on
# disk -- docs/open-questions.md's "Known defects carried on purpose" -- so this restores
# a verifiable checkpoint regardless of the India question).
data:
  index_path: data/chips/combined_all/index.parquet
  batch_size: 8
  num_workers: 4

task:
  model_factory: EncoderDecoderFactory
  model_args:
    # terramind_v1_tiny fits the GTX 1060; bump to _small if a bigger GPU is used.
    backbone: terramind_v1_tiny
    backbone_pretrained: true
    backbone_modalities: [S2L2A]
    backbone_bands:
      S2L2A: [BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3,
              NIR_BROAD, NIR_NARROW, SWIR_1, SWIR_2]
    necks:
      - name: SelectIndices
        indices: [2, 5, 8, 11]
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
    decoder: UNetDecoder
    decoder_channels: [256, 128, 64, 32]
    num_classes: 2
    rescale: true
  # Recall-first: Tversky with beta>alpha penalises false negatives (missed PV) harder
  # than false positives. gamma=1 = plain Tversky (no focal term).
  loss: tversky
  tversky_args: {alpha: 0.3, beta: 0.7, gamma: 1.0}
  class_weights: [0.25, 0.75]
  ignore_index: -1
  lr: 1.0e-4
  optimizer: AdamW
  optimizer_hparams:
    weight_decay: 0.05
  freeze_backbone: false
  plot_on_val: false

trainer:
  max_epochs: 60
  accumulate_grad_batches: 2

checkpoint_dir: data/models/v4_combined_all
patience: 8
# Same monitor as v3india (val/mIoU), not the base config's val/Accuracy -- matching the
# checkpoint we're actually trying to replace.
monitor: val/mIoU
monitor_mode: max
