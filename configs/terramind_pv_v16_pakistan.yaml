# TerraTorch fine-tuning config for PV segmentation -- v14's corpus with PAKISTAN's chips
# rebuilt from a fresh OpenStreetMap pull (2026-10-25).
#
# Identical recipe to configs/terramind_pv_v14_south_africa.yaml (backbone, necks, decoder,
# loss, lr, schedule, monitor metric, patience). The only variable is Pakistan's labels:
# OSM held 16,085 solar features in the July pull the published Pakistan chips came from and
# 31,835 on 2026-10-25, with 1,944 new polygons of 400 m2 or more (1,479 ground, 465
# rooftop), all inside already-composited cells.
#
# Corpus (data/chips/combined_pakistan_v16/index.parquet -> /home): every non-Pakistan row
# of data/chips/combined_south_africa/index.parquet (v14's corpus, South Africa's repeat
# kept) plus `earthpv chips --aoi pakistan --labels-dir <fresh pull>` (data/chips/pakistan_fresh
# -> /home), its train rows repeated clamp(round(7000 / n_train), 1, 8) times as
# scripts/run_country_compute.sh does for a localized country. The July Pakistan chips
# (data/chips/pakistan) are left out, not added, so no installation is labelled twice.
#
# Holdouts: Pakistan's `val_tiles` (the Multan cluster) as before, and Punjab's val chips.
# Every fresh Pakistan train chip in either holdout's cells or their 8-cell ring is marked
# `buffer` (Punjab's cells map to Pakistan's names at +85, +40). The July Pakistan chips
# had 353 train chips around Punjab's holdout, so v14's Punjab score is partly in-sample;
# this corpus does not repeat that.
#
# Ship rule: compared with v14 on the held-out installations (scripts/compare_backbones.py);
# whichever finds more at matched precision, a tie going to the local model.

data:
  index_path: data/chips/combined_pakistan_v16/index.parquet
  batch_size: 8
  num_workers: 4

task:
  model_factory: EncoderDecoderFactory
  model_args:
    # terramind_v1_tiny fits the GTX 1060; bump to _small if a bigger GPU is used.
    backbone: terramind_v1_tiny
    backbone_pretrained: true
    backbone_modalities: [S2L2A]
    backbone_bands:
      S2L2A: [BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3,
              NIR_BROAD, NIR_NARROW, SWIR_1, SWIR_2]
    necks:
      - name: SelectIndices
        indices: [2, 5, 8, 11]
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
    decoder: UNetDecoder
    decoder_channels: [256, 128, 64, 32]
    num_classes: 2
    rescale: true
  # Recall-first: Tversky with beta>alpha penalises false negatives (missed PV) harder
  # than false positives. gamma=1 = plain Tversky (no focal term).
  loss: tversky
  tversky_args: {alpha: 0.3, beta: 0.7, gamma: 1.0}
  class_weights: [0.25, 0.75]
  ignore_index: -1
  lr: 1.0e-4
  optimizer: AdamW
  optimizer_hparams:
    weight_decay: 0.05
  freeze_backbone: false
  plot_on_val: false

trainer:
  max_epochs: 60
  accumulate_grad_batches: 2

checkpoint_dir: data/models/v16_combined_pakistan
patience: 8
# Same monitor as v5 (val/mIoU), so the two are selected the same way.
monitor: val/mIoU
monitor_mode: max

# Training is protected against systemd-oomd restarts: continue from this run's own last.ckpt.
resume: true
