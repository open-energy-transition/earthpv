# TerraTorch fine-tuning config for PV segmentation -- v5's corpus with GUJARAT REPLACED
# BY NATIONAL INDIA.
#
# Identical recipe to configs/terramind_pv_v5_france.yaml. The only variable is the corpus:
# India's own national OpenStreetMap solar labels are added (owner request 2026-09-23: every
# new country's segmentation is LOCALIZED rather than run zero-shot).
#
# Corpus (data/chips/combined_india/index.parquet, written by
# scripts/run_country_compute.sh via
# `merge_chip_index.py --out ... germany punjab pakistan france india:R`,
# R = clamp(round(7000 / n_india_train), 1, 8)). The `gujarat` corpus that v4/v5 carry is
# DROPPED: national India chips already cover Gujarat, so keeping both would double-weight
# one state and put the same installations on both sides of the holdout.
#
# Val holdout: India's `val_tiles` = Gujarat's existing Surat-Bharuch-Vadodara val box
# (lon 72.7-73.9, lat 21.0-23.0; configs/aoi.yaml `gujarat.val_box`) mapped onto India's
# cell grid. v5 held that box out of its own gujarat corpus, so neither checkpoint has
# trained on it and scripts/compare_local_vs_v5.py scores them on equal footing.

data:
  index_path: data/chips/combined_india/index.parquet
  batch_size: 8
  num_workers: 4

task:
  model_factory: EncoderDecoderFactory
  model_args:
    # terramind_v1_tiny fits the GTX 1060; bump to _small if a bigger GPU is used.
    backbone: terramind_v1_tiny
    backbone_pretrained: true
    backbone_modalities: [S2L2A]
    backbone_bands:
      S2L2A: [BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3,
              NIR_BROAD, NIR_NARROW, SWIR_1, SWIR_2]
    necks:
      - name: SelectIndices
        indices: [2, 5, 8, 11]
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
    decoder: UNetDecoder
    decoder_channels: [256, 128, 64, 32]
    num_classes: 2
    rescale: true
  # Recall-first: Tversky with beta>alpha penalises false negatives (missed PV) harder
  # than false positives. gamma=1 = plain Tversky (no focal term).
  loss: tversky
  tversky_args: {alpha: 0.3, beta: 0.7, gamma: 1.0}
  class_weights: [0.25, 0.75]
  ignore_index: -1
  lr: 1.0e-4
  optimizer: AdamW
  optimizer_hparams:
    weight_decay: 0.05
  freeze_backbone: false
  plot_on_val: false

trainer:
  max_epochs: 60
  accumulate_grad_batches: 2

checkpoint_dir: data/models/v10_combined_india
patience: 8
# Same monitor as v5 (val/mIoU), so the two are selected the same way.
monitor: val/mIoU
monitor_mode: max
