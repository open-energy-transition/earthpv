# Areas of interest and label/chip parameters.
# Overture prunes its release directory to the LAST TWO releases, so a pin goes stale on a
# roughly monthly cadence and then 404s as `IO Error: No files found` -- which reads like
# "no data for this area", not "your release expired" (CLAUDE.md, Conventions & gotchas).
# Checked 2026-09-13: 2026-06-17.0 had already been pruned; only 2026-07-22.0 and
# 2026-08-19.0 remained. List what still exists with:
#   curl -s "https://overturemaps-us-west-2.s3.us-west-2.amazonaws.com/?list-type=2&prefix=release/&delimiter=/"
overture_release: "2026-08-19.0"

# Reuse Sentinel-2 composites + OSM/Overture labels already downloaded by the
# sibling `rooftopsenti` project instead of re-fetching (see src/earthpv/local_source.py).
# When a `source_region` dir exists, chips/inference read its composite COGs; the
# STAC/Overture fetchers are the fallback for regions without local artifacts.
local_root: /run/media/tobi/aidisc/rooftopsenti/data

# Solar arrays smaller than this (m²) are kept in labels but flagged; the
# headline detection target is > 400 m² (MIN_PV_AREA in chips.py) - smaller
# installations are covered by the density stage's aggregate estimate instead.
min_array_area_m2: 100.0
# Fraction of a solar polygon that must fall on a building footprint to count as rooftop.
rooftop_overlap_frac: 0.5
# Buildings smaller than this footprint (m²) are ignored for chip screening.
min_roof_area_m2: 200.0

aois:
  # Smoke-test tile: Freiburg im Breisgau + industrial outskirts (~12x11 km)
  freiburg:
    bbox: [7.70, 47.95, 7.90, 48.05]
  # NOTE ON `stack_window` (two-season 20-band stacking): OPT-IN, disabled by default.
  # Setting stack_window on an AOI switches chips/infer to the 2-layer (20-band) path,
  # which requires the 20-band model (configs/terramind_pv_seasonal.yaml) and per-cell
  # contrast composites. The default pipeline and the production checkpoint
  # (data/models/v2_combined/*.ckpt) are 10-band, so these keys are left commented.
  # It was tested and did not beat 10-band on Punjab (see README "Two-season stacking
  # experiment"); to re-enable, uncomment the stack_window below, rebuild the contrast
  # composites, and train/infer with the seasonal config.

  # Training country
  germany:
    bbox: [5.866, 47.270, 15.042, 55.059]
    division: { name: Deutschland, country: DE, subtype: country }
    source_region: germany_500          # rooftopsenti data/<region> dir
    # MGRS tiles held out for validation (geographic split); in the local composite set.
    val_tiles: [32TQT, 32TPT]
    # Two-season opt-in (see note above). When enabled, chips read data/composites/germany
    # (0.1° cells from scripts/build_germany_seasonal.py) and val_tiles must instead be
    # the SW 0.1° cell names: ["0085_0491","0087_0489","0089_0487","0086_0488","0085_0488",
    # "0085_0489","0082_0476","0075_0480","0088_0488","0086_0489","0095_0476"].
    # stack_window: ["2025-11-01", "2026-03-15"]
  # Inference target + PK training source (chips read data/composites/punjab)
  punjab:
    bbox: [69.30, 27.70, 75.40, 34.05]
    division: { name: Punjab, country: PK, subtype: region }
    source_region: pakistan_500         # Punjab tiles are a subset of the PK download
    # Geographic val holdout = the whole Faisalabad cluster (~73.0-73.35E, 31.3-31.55N),
    # a contiguous block ~100 km from the Lahore training cluster so jitter/window overlap
    # can't leak val positives into train. ~31% of Punjab positives, rooftop-dominant.
    # (chips stage tags split=val for chips whose composite cell is in this list.)
    val_tiles: ["0035_0036", "0036_0036", "0036_0037", "0036_0038", "0037_0036",
                "0037_0037", "0037_0038", "0038_0036", "0038_0037", "0038_0038",
                "0039_0037", "0039_0038", "0040_0037", "0040_0038"]
    # Two-season opt-in (see note above): clear post-monsoon contrast to the dry-season base.
    # stack_window: ["2025-09-20", "2025-11-15"]
  # Boom-window stacking: same idea as the seasonal experiment above, but the contrast
  # layer is the actual pre-boom epoch (2021-10 to 2022-01, before Pakistan's solar
  # import boom) instead of a same-year weather season -- the seasonal test had no real
  # adoption change between its two windows to learn from; this one does, by
  # construction, since almost every currently-mapped Punjab installation postdates it
  # (fitted onsets cluster 2022-2024, docs/experiments.md). Composites
  # live under data/composites/punjab_boom (own tree, not data/composites/punjab, so the
  # seasonal experiment's stale composite_1 -- built before the 2026-07-26 Collection-1
  # radiometric-offset fix in imagery.py -- is never silently reused): composite_0 is
  # symlinked from punjab's own 65 cells (current epoch, unaffected by that bug) plus 9
  # freshly-fetched cells to complete val coverage; composite_1 is freshly built at the
  # boom window with the fixed imagery.py (scripts/build_punjab_boom_composites.py).
  punjab_boom:
    bbox: [69.30, 27.70, 75.40, 34.05]
    division: { name: Punjab, country: PK, subtype: region }
    source_region: pakistan_500
    val_tiles: ["0035_0036", "0036_0036", "0036_0037", "0036_0038", "0037_0036",
                "0037_0037", "0037_0038", "0038_0036", "0038_0037", "0038_0038",
                "0039_0037", "0039_0038", "0040_0037", "0040_0038"]
    stack_window: ["2021-10-01", "2022-01-24"]
  # Country-wide inference: compose + infer over every building-populated cell.
  # grid_origin anchors the cell grid to punjab's (boundary total_bounds origin,
  # full precision) so punjab's already-composited cells are reused by renaming.
  pakistan:
    bbox: [60.87, 23.80, 77.13, 37.09]
    division: { name: Pakistan, country: PK, subtype: country }
    source_region: pakistan_500
    grid_origin: [69.3405158324398, 27.7089663393252]
    # Small geographic val holdout: an isolated Multan-area cluster (~71.6E, 30.3N),
    # rooftop-dominant, ~20 km from the nearest training positive so no window/jitter
    # leakage. Deliberately small (~38 positives, ~1.5%) to maximise training data.
    val_tiles: ["0106_0064", "0107_0065", "0108_0065"]
    # Two-season opt-in (see note above).
    # stack_window: ["2025-09-20", "2025-11-15"]
    # `earthpv dashboard --aoi pakistan` reads this block: an ordered panel list, each
    # {key, label, sublabel, src, note}. `src` is repo-relative; `key` becomes
    # "<key>.html" inside the generated bundle. This CLI command and the bundle it
    # builds are no longer used by the docs site (docs/results/*.md links directly to
    # each standalone page instead -- see docs/reproduce.md's "Step 7: publish it on
    # this site"), but the command still works if a bundled, tab-switching page is
    # useful for something else.
    dashboard:
      title: Pakistan
      panels:
        - key: capacity
          label: Capacity
          sublabel: Verified / Best estimate / Ceiling
          src: docs/assets/interactive/pakistan_evidence_atlas.html
          note: "Two tiers by standard of proof, not by point estimate: hand-mapped + two detectors agree, and this project's best defensible figure. See Capacity density."
        - key: pose
          label: Panel orientation
          sublabel: Glint-fitted tilt & azimuth, n=2000
          src: results/glint_validation_pakistan/pv_pose_country2000.html
          note: "Fitted pose for 290 installations whose Sentinel-2 glints agree on one fixed plane. See Panel pose from glint."
        - key: potential
          label: Rooftop potential
          sublabel: Uncovered large roofs x irradiance, plus PV saturation
          src: results/pakistan_pv_potential_atlas.html
          note: "Where large (>= 200 m2), currently-uncovered roofs and high modelled irradiance overlap -- a siting signal for future installations, built from footprint geometry alone, never a PV-presence probability. A second tab shows PV saturation (existing PV area / roof area) to contrast dense-adoption areas against under-adopted ones."

  # India pilot: no rooftopsenti local dataset exists for India (unlike PK/DE), so this
  # is the first AOI exercising compose.py's VIDA-buildings + geoBoundaries fallbacks
  # (no `source_region` key here on purpose). Gujarat chosen as the pilot state - it has
  # India's highest rooftop-solar penetration (Surya Gujarat / net-metering programs),
  # concentrated in mid-size cities (Ahmedabad, Surat, Vadodara, Rajkot) rather than
  # spread thin like utility-scale-heavy states (e.g. Rajasthan).
  # 2026-08-14: first India-inclusive retrain (`terramind_pv_v4_all.yaml`) adds Gujarat's
  # 760 chips (built 2026-07-12, never previously trained on) to the combined corpus. A
  # geographic val holdout was carved out of the existing chip index (no rebuild) for
  # this: the Surat-Bharuch-Vadodara corridor, lon 72.7-73.9E / lat 21.0-23.0N, 128 of 760
  # chips (16.8%, 62 with PV) -- so this run is the first with an India-specific
  # validation signal, not just Germany/Pakistan health checks.
  gujarat:
    bbox: [68.0, 20.0, 74.6, 24.8]
    division: { name: Gujarat, country: IN, subtype: region }
    val_box: [72.7, 21.0, 73.9, 23.0]  # lon0, lat0, lon1, lat1 -- descriptive only, chips.py doesn't read this key; the split column in data/chips/gujarat/index.parquet was patched directly (see note above)

  # The 9 Rule-1-complete calibration quadrats (docs/calibration-mapping-protocol.md),
  # added as fraction-head training AOIs (2026-07-29): each is a tiny 1 km^2-ish box
  # inside a region pakistan_500 already has composites for, so no new imagery. No
  # val_tiles -- every chip built here is `split=train`. karachi_coast is deliberately
  # NOT trained on: it is the held-out fold for measuring this retrain's actual effect
  # (see docs/methods/detection.md / the fraction-head-v2 retrain writeup).
  faisalabad_calib_1km:
    bbox: [73.047103, 31.493125, 73.057639, 31.502108]
    division: { name: Punjab, country: PK, subtype: region }
    source_region: pakistan_500
  # Replaced its 1 km2 predecessor 2026-08-05 (hand-drawn 6.61 km2 boundary that fully
  # contains it). Any composites cached under data/composites/lahore_calib_1km/ cover only
  # the old core and are orphaned, not wrong -- recompose under the new key for the full box.
  lahore_calib_6p61km2:
    bbox: [74.392709, 31.450724, 74.432030, 31.477134]
    division: { name: Punjab, country: PK, subtype: region }
    source_region: pakistan_500
  mardan_calib_1km:
    bbox: [72.019951, 34.18488, 72.0308, 34.193896]
    division: { name: Khyber Pakhtunkhwa, country: PK, subtype: region }
    source_region: pakistan_500
  # Replaced its 1 km2 predecessor 2026-08-05 (hand-drawn 3.92 km2 boundary that fully
  # contains it). Composites cached under data/composites/multan_calib_1km/ cover only the
  # old core and are orphaned, not wrong -- recompose under this key for the full box.
  multan_calib_3p92km2:
    bbox: [71.370492, 30.117067, 71.392508, 30.134698]
    division: { name: Punjab, country: PK, subtype: region }
    source_region: pakistan_500
  quetta_calib_1km:
    bbox: [67.010096, 30.187005, 67.02048, 30.196026]
    division: { name: Balochistan, country: PK, subtype: region }
    source_region: pakistan_500
  sialkot_calib_1km:
    bbox: [74.536883, 32.499346, 74.547524, 32.508364]
    division: { name: Punjab, country: PK, subtype: region }
    source_region: pakistan_500
  # Replaced its 1 km2 predecessor 2026-08-05 (hand-drawn 4.14 km2 boundary that fully
  # contains it). Composites under data/composites/site_karachi_calib_1km/, if any, cover
  # only the old core and are orphaned, not wrong.
  site_karachi_calib_4p14km2:
    bbox: [66.988192, 24.900061, 67.009263, 24.918628]
    division: { name: Sindh, country: PK, subtype: region }
    source_region: pakistan_500
  # Replaced its 1 km2 predecessor 2026-08-05 (hand-drawn 4.34 km2 boundary that fully
  # contains it). Composites cached under data/composites/sundar_calib_1km/ cover only the
  # old core and are orphaned, not wrong -- recompose under this key for the full box.
  sundar_calib_4p34km2:
    bbox: [74.158294, 31.280660, 74.180524, 31.305267]
    division: { name: Punjab, country: PK, subtype: region }
    source_region: pakistan_500
  # karachi_coast: held out on purpose, see note above -- no chips built. Replaced its
  # 0.49 km2 predecessor 2026-08-05 with a hand-drawn 2.16 km2 boundary, and NO LONGER
  # Rule-1 complete (the owner withdrew that status for the extended area), so it is no
  # longer a source of trustworthy negatives -- which was most of the reason to hold it out.
  # Keeping the holdout anyway: the fraction-head experiment on record used it as the
  # out-of-sample box, and building chips here now would retroactively invalidate that.
  karachi_coast_calib_2p16km2:
    bbox: [67.031987, 24.789637, 67.053230, 24.808464]
    division: { name: Sindh, country: PK, subtype: region }
    source_region: pakistan_500

  # Added by scripts/new_region.py. No source_region key, so chips and compose fetch
  # from Planetary Computer STAC rather than a local composite cache.
  france:
    bbox: [-5.15, 41.33, 9.56, 51.09]
    division: { name: France, country: FR, subtype: country, iso3: FRA }
    # Pin the 0.1 deg grid to the bbox corner so a targeted run over the calibration
    # communes and a later national run name the same cell the same way (and so the
    # national run's resumable skip actually reuses them). Without this the origin comes
    # from whatever boundary lookup succeeded at the time.
    grid_origin: [-5.15, 41.33]
    # Summer 2024, chosen to match the calibration mapping epoch rather than "now":
    # 10 of the 14 hand-mapped communes were surveyed on 2023-2024 IGN imagery, and the
    # ODRE register publishes a 2024-12-31 vintage, so imagery, labels and the validation
    # reference all sit in one epoch. Four communes (Langoat 2021, Saulny and Eaunes 2022,
    # Gannay 2022-23) are older than this window and their labels therefore understate
    # what the imagery shows -- see docs/results/france.md.
    compose_window: ["2024-05-01", "2024-09-30"]

  # Zambia national run (2026-09-13). No source_region: chips/compose/labels all come
  # from the open fetchers (Planetary Computer STAC, live Overpass, VIDA ZMB).
  # compose_window is the SOUTHERN-hemisphere dry season (May-Oct), not the default
  # Punjab winter window. grid_origin pins the cell grid to the bbox origin so a later
  # targeted quadrat compose names cells identically to this national one.
  zambia:
    bbox: [21.999, -18.08, 33.706, -8.224]
    division: { name: Zambia, country: ZM, subtype: country, iso3: ZMB }
    grid_origin: [21.999, -18.08]
    # Southern-hemisphere dry season. The compose default (Nov-Mar) is Zambia's RAINY
    # season and would give a cloud-contaminated median; preflight over this window
    # found 11,647 scenes under 40% cloud across 187 MGRS tiles, median cloud 0%.
    compose_window: ["2025-05-01", "2025-10-15"]
    # Geographic val holdout = the Copperbelt cluster (Kitwe / Kalulushi / Ndola,
    # ~28.0-28.4E, -13.0 to -12.6N), ~700 km from the Lusaka training cluster, so
    # neither the +/-900 m chip jitter nor the 2.24 km window can leak a training
    # positive into it. It holds 41 of Zambia's 133 mapped installations at or above the
    # 400 m2 chip threshold, all ground-mount -- which is what the mapped population
    # actually is here (75% of features and 98% of area are ground). Lusaka is kept in
    # training on purpose: it is the ONLY cell carrying rooftop positives (21 of the
    # country's 54), so holding it out would leave no rooftop signal at all.
    val_tiles: ["0060_0051", "0060_0052", "0060_0053", "0060_0054",
                "0061_0051", "0061_0052", "0061_0053", "0061_0054",
                "0062_0051", "0062_0052", "0062_0053", "0062_0054",
                "0063_0051", "0063_0052", "0063_0053", "0063_0054"]

  # Nigeria national run (2026-09-15). No source_region: chips/compose/labels all come
  # from the open fetchers (Planetary Computer STAC, live Overpass, VIDA NGA).
  # compose_window is the NORTHERN-hemisphere dry season, and it is deliberately the
  # short one: Nigeria spans 4N to 14N, so the Sahel north has a long dry season but the
  # Niger Delta south has a very short one, and the south is the binding constraint.
  # Preflight over this window found 6,103 scenes under 40% cloud across 179 MGRS tiles
  # (median cloud 5%) nationally, but only 214 across the 20 tiles covering the southern
  # strip (median cloud 28%). Widening to 2025-10-15:2026-04-15 buys just 21 more scenes
  # there (+10%) for six weeks of extra epoch spread, so the tight window wins.
  # grid_origin pins the cell grid to the bbox origin so a later targeted quadrat compose
  # names cells identically to this national one.
  nigeria:
    bbox: [2.668, 4.24, 14.68, 13.893]
    division: { name: Nigeria, country: NG, subtype: country, iso3: NGA }
    grid_origin: [2.668, 4.24]
    compose_window: ["2025-11-01", "2026-03-15"]

  # Vietnam (registered 2026-09-23, owner request: national run + localized retrain).
  # bbox = geoBoundaries ADM1 union floored/ceiled to 0.1 deg, EXCEPT the east edge, cut
  # at the mainland's 109.47E so the Paracels and Spratlys (which geoBoundaries puts under
  # Da Nang and Khanh Hoa, out to 114.997E) are not a grid column of open sea. grid_origin
  # is the floored corner, so the boundary path and the raw-bbox fallback name cells
  # identically. 12-month window: no single dry season works nationally -- the north is
  # overcast Jan-Apr (Hanoi: 16 scenes under 30% cloud in 20 months), the centre is wet
  # Sep-Dec, the south dry Dec-Apr -- and `annual_composite` keeps the 12 least-cloudy
  # scenes per cell whatever the window. The register measured "12 frames of the year"
  # slightly above 12 dry-season frames. `cell_selection: duckdb` = per-cell building
  # counts aggregated in DuckDB and cached (compose._vida_cell_counts_sql).
  vietnam:
    bbox: [102.1, 8.4, 109.5, 23.4]
    division: { name: Vietnam, country: VN, subtype: country, iso3: VNM }
    grid_origin: [102.1, 8.4]
    compose_window: ["2025-09-01", "2026-08-31"]
    cell_selection: duckdb

  # India, national (registered 2026-09-23). Supersedes the `gujarat` AOI for new work;
  # Gujarat's 1,527 composites are NOT reused (their July compose logged 403 storms that
  # dropped scenes, and they carry no provenance tags). ADM1 union bounds
  # [68.0935, 6.7544, 97.4115, 37.0776] incl. Andaman & Nicobar and Lakshadweep.
  # 526.8M VIDA buildings: `cell_selection: duckdb` is REQUIRED here -- the in-memory
  # point path would need ~50 GB (it peaks at 6.9 GB for Nigeria's 68M). Default Nov-Mar
  # window, the same epoch as the gujarat chips already in the v4/v5 corpora.
  india:
    bbox: [68.0, 6.7, 97.5, 37.1]
    division: { name: India, country: IN, subtype: country, iso3: IND }
    grid_origin: [68.0, 6.7]
    compose_window: ["2025-11-01", "2026-03-15"]
    cell_selection: duckdb
    # Val holdout = Gujarat's Surat-Bharuch-Vadodara val box (gujarat.val_box, lon 72.7-73.9,
    # lat 21.0-23.0): every India cell whose centre falls inside it, 240 cells. v5 held
    # this box out of its own gujarat corpus, so the localized v10 and v5 are both scored
    # out-of-sample on it (scripts/compare_local_vs_v5.py). Chosen from geography, before
    # training, and inherited rather than re-picked so the comparison has no free choice.
    val_tiles: [
      "0047_0143", "0047_0144", "0047_0145", "0047_0146", "0047_0147", "0047_0148", "0047_0149", "0047_0150",
      "0047_0151", "0047_0152", "0047_0153", "0047_0154", "0047_0155", "0047_0156", "0047_0157", "0047_0158",
