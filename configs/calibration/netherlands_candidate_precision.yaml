lead_review:
  derived: '2026-11-10'
  reviewer: owner, 2026-11-10, every queued lead on the large installation review
    page
  review_csv: results/netherlands_large_review/review.csv
  population: model-drawn new leads from min_area_m2 up to max_candidate_m2 with no
    mapped solar within min_distance_m of them (export.new_lead_mask), inside the
    atlas's regions and through the lead screens
  pricing: a pv verdict sets the lead's P(real) to 1 on the ground and to 1/rooftop_outline_ratio
    on a roof (the model's roof outline is about that many times its array), not_pv
    to 0; its size bin's recall still applies; unsure or blank keeps the bin's P(real)
  rooftop_outline_ratio: 2.5
