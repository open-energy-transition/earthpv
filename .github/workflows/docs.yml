name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/build_docs_figures.py"
      - "results/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: pip install mkdocs-material matplotlib pillow

      # Regenerates every figure whose source is in the checkout: the hand-authored
      # diagrams, and the charts driven by configs/. `results/` is gitignored, so the
      # charts and interactive pages that read pipeline outputs are skipped here with a
      # notice and served from the SVGs committed under docs/assets/. Run
      # `pixi run docs-figures` locally, where results/ exists, before pushing a change
      # that should move one of those.
      - name: Regenerate figures and interactive pages
        run: python scripts/build_docs_figures.py

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
