site_name: earthpv
site_description: >-
  Open rooftop solar mapping from Sentinel-2. A recall-first geospatial foundation
  model, an OpenStreetMap validation loop, and a calibrated national capacity atlas.
site_url: https://open-energy-transition.github.io/earthpv/
repo_url: https://github.com/open-energy-transition/earthpv
repo_name: open-energy-transition/earthpv
edit_uri: edit/main/docs/
copyright: >-
  Open Energy Transition. Code under MIT, documentation and data under open licences.

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/figures/earthpv-logo-mark-white.png
  favicon: assets/figures/favicon.png
  # No webfont: the interactive result pages embedded here set their own faces to
  # system-ui / ui-monospace, and extra.css points Material at the same stacks so text
  # matches across an iframe boundary. Also drops the Google Fonts request.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  # Drives each embedded result page's own light/dark switch from Material's, so the
  # two dark modes cannot disagree. See the file header for why it clicks the toggle.
  - assets/javascripts/embed-theme.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.smartsymbols

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/open-energy-transition/earthpv
      name: earthpv on GitHub
    - icon: fontawesome/solid/globe
      link: https://openenergytransition.org
      name: Open Energy Transition

nav:
  # Overview is the landing page (index.md = site root).
  - Overview: index.md
  # The capacity map itself, full-bleed (hide: [navigation, toc] in its front
  # matter) so it reads as part of the site rather than an escape hatch to a bare
  # standalone file, plus the rest of the Pakistan results pages. Reused here
  # rather than duplicated under capacity-maps/ -- add new countries as their own
  # pages under capacity-maps/<country>.md as they get their own atlas.
  - PV Atlas:
      - Pakistan: atlas.md
      - Pakistan PV Capacity map: results/capacity.md
      - Pakistan Capacity by installation size: results/capacity-by-size.md
#      - Mapping leads: results/leads.md
#      - Growth map: results/growth.md
      - Pakistan Panel pose from glint: results/pv-pose.md
#      - Gujarat capacity map: results/gujarat.md
  # Then how the shipped pipeline actually works, with its reference pages.
  - How it works:
      - how-it-works.md
      - Detection model: methods/detection.md
      - Segmentation & the building map: methods/segmentation.md
      - Rooftop classifier (roofclf): methods/roofclf.md
#      - Capacity density: methods/density.md
      - Calibration: methods/calibration.md
      - Validation against MaStR: methods/mastr-validation.md
      - Calibration quadrats overview: methods/calibration-quadrats.md
      - Quadrat protocol: calibration-mapping-protocol.md
      - Roofclf random-cell validation: methods/roofclf-national-validation.md
      - Solar glint: methods/glint.md
      - Glint image gallery: glint_examples.md
      - Validity and limitations: methods/validity.md
  - Setup:
      - Tutorial: tutorial.md
      - Setup New Country: reproduce.md
      - Contribute a calibration area: contribute.md
  # History last: what was tried, and what is still undecided. Every page under
  # Experiments carries a status banner, because several describe a pipeline that has
  # since been replaced.
  - Experiments:
      - experiments.md
      - Calibration boxes log: issues/pakistan-calibration-boxes.md
      - Quadrats as training data: issues/quadrats-as-training-data.md
      - Roofclf national deployment: issues/roofclf-national-deployment-and-temporal-features.md
      - Roofclf cell-edge false positives: issues/roofclf-cell-edge-false-positives.md
      - Quadrat-supervised fraction retrain: issues/quadrat-supervision-fraction-retrain.md
      - Fraction-head hard-negative retrain: issues/fraction-head-hard-negative-retrain.md
      - SPPI spectral index: issues/sppi-spectral-index-evaluation.md
      - Boom-window stacking: issues/boom-window-stacking-experiment.md
      - Standard pose matched filter: issues/standard-pose-matched-filter.md
      - Glint spike-rate estimator: issues/glint-spike-rate-density-estimator.md
      - Glint PSF and matched filtering: issues/glint-psf-matched-filter.md
      - Glint tile-batched coverage: issues/glint-tile-batched-coverage.md
      - Glint-validated training labels: issues/glint-validated-training-labels.md
      - Epoch jump as recall signal: issues/epoch-jump-recall-signal.md
      - Calibration imagery dating: issues/calibration-imagery-dating.md
      - Small ground-mount instrument: issues/small-ground-mount-instrument.md
      - Calibration density mismatch: issues/roofclf-calibration-density-mismatch.md
  - Open questions: open-questions.md
  - About:
      - TraceTheSun concept note: 22072026-Concept-Note-TraceTheSun.md
